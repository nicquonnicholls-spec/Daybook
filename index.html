<style>
/* Layout: navy rail with gold trident and focus-timer card; light workspace of white cards; header row with actions on the right */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --fill:#F4F6FB; --fill-2:#EEF1F8;
  --line:#E3E8F1; --line-2:#D3DAE7;
  --ink:#0F1A3A; --ink-2:#2A3554; --muted:#5E6A85; --faint:#8A94AB;
  --primary:#2453D6; --primary-2:#1C45BD; --primary-soft:#E8EEFD;
  --navy:#13204A; --navy-2:#1C2B5C; --navy-line:rgba(255,255,255,.09); --rail-ink:#C3CCE3;
  --gold:#F5B731;
  --red:#C9302C; --red-soft:#FDECEC; --red-line:#F5C2C0;
  --amber:#B0560B; --amber-soft:#FDEEDF; --amber-line:#F4C8A0;
  --green:#15803D; --green-soft:#E3F5EA;
  --violet:#6D3FD9; --violet-soft:#F0EAFE;
  --st-todo:#94A3B8; --st-drafting:#2453D6; --st-review:#E08A0B; --st-revising:#7C3AED; --st-done:#16A34A;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 24px 60px -20px rgba(15,26,58,.28);
  --f-display:"Plus Jakarta Sans",-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}

/* Rail */
.rail{background:var(--navy);color:var(--rail-ink);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:28px;padding-block:30px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;align-items:center;gap:12px;padding-inline:12px}
.brand .logo{width:30px;height:34px;flex:none}
.brand b{display:block;font-weight:800;font-size:21px;color:#fff;letter-spacing:-.02em;line-height:1.15}
.brand small{display:block;font-size:12.5px;color:var(--rail-ink)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border:0;border-radius:12px;background:none;color:var(--rail-ink);font-weight:500;font-size:15px;text-align:left;white-space:nowrap}
.nav button svg{width:20px;height:20px}
.nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--primary);color:#fff;font-weight:600}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-variant-numeric:tabular-nums}
.nav button[aria-current="page"] .badge{background:rgba(255,255,255,.22)}
.nav .badge.hot{background:#E5484D;color:#fff}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:18px}
.timer-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px 18px 18px;border-radius:16px;background:var(--navy-2);border:1px solid var(--navy-line)}
.timer-card .tc-l{border:0;background:none;padding:0;text-align:left;color:#fff;display:flex;flex-direction:column;gap:2px}
.timer-card .tc-l small{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink);font-weight:600}
.timer-card .tc-l b{font-size:30px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.timer-card .tc-l span{font-size:12px;color:var(--rail-ink);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-play{width:46px;height:46px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -8px rgba(36,83,214,.9)}
.tc-play svg{width:18px;height:18px;fill:currentColor;stroke:none}
.timer-card.running .tc-play{background:#fff;color:var(--primary)}
.rail-quote{margin:0;padding-inline:10px;font-size:13px;line-height:1.5;color:var(--rail-ink)}

/* Main */
.main{position:relative;min-width:0;padding-block:36px 72px;padding-left:44px;padding-right:max(44px,env(safe-area-inset-right,0px))}
.topbar{position:absolute;top:36px;right:max(44px,env(safe-area-inset-right,0px));z-index:3;display:flex;align-items:center;gap:10px}
.round-btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.round-btn svg{width:19px;height:19px}
.round-btn:hover{border-color:var(--faint)}
.round-btn .bdot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#E5484D;border:2px solid #fff}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;display:grid;place-items:center}
.avatar svg{width:19px;height:19px}
.save-btn{display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px}
.save-btn svg{width:18px;height:18px}
.save-btn .t{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.save-btn .t small{font-size:11.5px;font-weight:500;color:var(--muted)}
.save-btn .dot{display:none}
.save-btn.unsaved{background:var(--amber-soft);border-color:var(--amber-line)}
.save-btn.unsaved svg{color:var(--amber)}
.save-btn.unsaved .t small{color:var(--amber)}
.new-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--primary);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px -10px rgba(36,83,214,.8)}
.new-btn svg{width:18px;height:18px;stroke-width:2.2}
.new-btn:hover{background:var(--primary-2)}

.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.ph{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:20px;align-items:end;margin-bottom:4px}
.ph>div:first-child{display:contents}
.ph .eyebrow,.ph h1{grid-column:1/-1;padding-right:460px}
.ph .sub{grid-column:1}
.ph>:not(div:first-child){grid-column:2;justify-self:end;align-self:end}
.ph>div:first-child:only-child .sub{grid-column:1/-1}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,46px);letter-spacing:-.035em;line-height:1.05;margin:0;text-wrap:balance;color:var(--ink)}
.sub{margin:12px 0 0;color:var(--muted);max-width:68ch;font-size:17px}
.sub b{color:var(--ink);font-weight:700}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.015em;margin:0;color:var(--ink)}
.loading{color:var(--muted);padding:40px 0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 22px;font-weight:700;font-size:14.5px;border:1px solid transparent;background:var(--fill);color:var(--ink);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px -12px rgba(36,83,214,.8)}
.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--faint)}
.btn.outline{background:var(--surface);border:1.5px solid var(--primary);color:var(--primary)}
.btn.outline svg{fill:currentColor;stroke:none;width:14px;height:14px}
.btn.outline:hover{background:var(--primary-soft)}
.btn.block{width:100%}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--faint);flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:var(--fill-2);color:var(--ink)}
.link{border:0;background:none;color:var(--primary);font-weight:600;font-size:14.5px;padding:4px 0;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.card-h .link::after{content:"→";font-size:15px}
.link:hover{color:var(--primary-2);text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:7px 15px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip .n{margin-left:6px;opacity:.8;font-variant-numeric:tabular-nums}

/* Cards */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ch-left{display:flex;align-items:center;gap:14px;min-width:0}
.ch-left p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.ichip{--tc:#2453D6;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc) 11%,#fff);color:var(--tc)}
.ichip svg{width:21px;height:21px}
.card-h .count{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:600}
.card-note{margin:0;font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:22px;align-items:start}
.today-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 16px 16px 18px;border-radius:14px;background:var(--fill);min-width:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;text-align:left}
.row-title{font-weight:700;font-size:15.5px;overflow-wrap:anywhere;color:var(--ink)}
.row-meta{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.row.is-done{opacity:.6}
.row.is-done .row-title{text-decoration:line-through;color:var(--faint);font-weight:600}
.row .icon-btn{color:var(--faint)}
.ex{white-space:nowrap;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px;font-weight:600;background:var(--surface)}
.empty{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;margin:0}
.empty svg{color:var(--faint);width:20px;height:20px}
.check{position:relative;flex:none;width:24px;height:24px}
.check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.check span{position:absolute;inset:0;border-radius:7px;border:1.6px solid #A9B3C7;background:#fff;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check input:checked+span{background:var(--st-done);border-color:var(--st-done)}
.check input:checked+span::after{content:"";width:10px;height:5px;border:2.2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.pill{flex:none;font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--fill-2);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--primary-soft);color:var(--primary)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.row-meta .pill{font-size:12px;padding:2px 9px;margin-left:4px}
details.done-list summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14.5px;padding:2px 0}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tile{--tc:#5E6A85;position:relative;border-radius:var(--r);padding:20px 22px 22px;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:16px;align-items:baseline;color:var(--ink);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--line-2)}
.tile .ichip{grid-column:1/-1;width:36px;height:36px;border-radius:10px;background:var(--fill-2);color:var(--muted)}
.tile .ichip svg{width:18px;height:18px}
.tile b{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--faint)}
.tile span.l{font-size:15px;color:var(--muted);font-weight:500}
.tile.on{border:1.5px solid var(--primary);box-shadow:0 0 0 3px rgba(36,83,214,.06)}
.tile.on .ichip{background:var(--primary-soft);color:var(--primary)}
.tile.on b{color:var(--ink)}
.tile.alert{border:1.5px solid var(--red-line)}
.tile.alert .ichip{background:var(--red-soft);color:var(--red)}
.tile.alert b{color:var(--red)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-radius:14px;border:1px dashed var(--line-2);color:var(--muted);font-size:14.5px;background:var(--surface)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.welcome h2{font-size:26px}
.welcome p{margin:0;color:var(--muted);max-width:62ch}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap}

/* Summary rows (Waiting on / Action items) */
.sumcard{padding:4px 24px;gap:0}
.sumrow{display:flex;align-items:center;gap:14px;padding:17px 0;border-top:1px solid var(--line);min-width:0}
.sumrow:first-child{border-top:0}
.sumrow>svg{color:var(--muted);width:20px;height:20px}
.sumrow b{font-weight:700;font-size:15.5px}
.sumrow .sr-v{margin-left:auto;color:var(--muted);font-size:14.5px;text-align:right}
.sumrow .sr-v.warn{color:var(--amber);font-weight:600}
.sumrow .link{font-size:14.5px}

/* Priority matrix */
.axis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-inline:6px;font-weight:700}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.quad{border-top:4px solid var(--tc)}

/* Reading */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.rcard{gap:10px}
.rcard .src{font-size:13.5px;color:var(--muted);margin:0}
.rcard .why{margin:0;font-size:14.5px;color:var(--ink-2);overflow-wrap:anywhere}
.rcard .foot{display:flex;align-items:center;gap:10px;margin-top:auto;flex-wrap:wrap;padding-top:6px}
.rcard .title-btn{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.ext{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-weight:600;font-size:14px;text-decoration:none}
.ext svg{width:16px;height:16px}
select.mini{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;height:auto}

/* Meetings */
.mtg .when{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);margin:0 0 2px;font-weight:700}
.mtg .who{font-size:14px;color:var(--muted);margin:0}
.mtg .notes{margin:0;white-space:pre-wrap;font-size:14.5px;color:var(--ink-2);overflow-wrap:anywhere}
.owner{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--violet-soft);color:var(--violet)}

/* Week */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .lbl{font-size:14px;font-weight:700;padding:0 6px;font-variant-numeric:tabular-nums}
.prios{display:flex;flex-direction:column;gap:10px}
.prio{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:14px;background:var(--fill)}
.prio .num{font-weight:800;color:var(--primary);width:18px;font-variant-numeric:tabular-nums}
.prio input[type=text]{flex:1;min-width:0;border:0;background:none;padding:6px 0;font-weight:700;font-size:16px;border-radius:0;border-bottom:1px dashed transparent;height:auto}
.prio input[type=text]:focus{outline:none;border-bottom-color:var(--primary);box-shadow:none}
.prio.is-done input[type=text]{text-decoration:line-through;color:var(--faint)}
.review label{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14.5px}

/* Form fields */
textarea,input[type=text],input[type=date],input[type=url],select{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 13px;width:100%;min-width:0;color:var(--ink)}
textarea:focus,input[type=text]:focus,input[type=date]:focus,input[type=url]:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,83,214,.14)}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
.field,.fields>*,.act-row>*,.step-row>*{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;height:44px;min-height:44px;line-height:22px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
select,.fields input[type=text],.fields input[type=url],.act-row input,.step-row input[type=text],.addfix input{height:44px}

/* Focus */
.focus-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px;align-items:center}
.ring{width:100%;max-width:280px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p,0) * 1turn),var(--fill-2) 0);display:grid;place-items:center;margin-inline:auto}
.ring-in{width:calc(100% - 22px);aspect-ratio:1;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.digits{font-weight:800;font-size:clamp(42px,8vw,58px);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring-in small{color:var(--muted);font-size:13.5px;max-width:80%;text-align:center;overflow-wrap:anywhere}
.fctl{display:flex;flex-direction:column;gap:16px}
.fctl .btns{display:flex;gap:10px;flex-wrap:wrap}
.fctl label{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14.5px}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14.5px}
.bars .b span{overflow-wrap:anywhere;font-weight:600}
.bars .b em{font-style:normal;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars .track{grid-column:1/-1;height:8px;border-radius:6px;background:var(--fill-2);overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--primary);border-radius:6px}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:160px}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cols .c i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--primary);min-height:3px}
.cols .c.zero i{background:var(--fill-2)}
.cols .c.today i{background:var(--st-done)}
.cols .c em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cols .c span{font-size:12px;color:var(--faint);font-weight:700}
.bigstat{display:flex;gap:28px;flex-wrap:wrap;align-items:stretch}
.bigstat div{display:flex;flex-direction:column;gap:2px;flex:1}
.bigstat div+div{border-left:1px solid var(--line);padding-left:28px}
.bigstat div b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.bigstat div span{font-size:14.5px;color:var(--muted)}

/* Month calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:30px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cal-head .mnav{display:flex;align-items:center;gap:4px}
.cal{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font-size:11.5px;font-weight:700;color:var(--faint);text-align:center;text-transform:uppercase;letter-spacing:.08em;padding-bottom:2px}
.cal .wk{font-size:11px;color:var(--faint);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cday{min-height:52px;border:1.5px solid transparent;border-radius:12px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:7px 2px 8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.cday:hover{border-color:var(--line-2)}
.cday.out{background:none;color:var(--faint);font-weight:500}
.cday.dl{background:var(--primary-soft);color:var(--primary);font-weight:700}
.cday.late{color:var(--red)}
.cday.today .dn{background:var(--primary);color:#fff;border-radius:99px;padding:0 7px}
.cday.sel{border-color:var(--primary)}
.dots{display:flex;gap:3px;min-height:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dots em{font-style:normal;font-size:9.5px;line-height:1;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span,.tl{display:inline-flex;align-items:center;gap:6px}
.legend i,.tl i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tl{font-weight:700;color:var(--ink)}
.agenda{display:flex;flex-direction:column;gap:12px;min-width:0}
.agenda h3{margin:0;font-size:17px;font-weight:700}

/* File card, toggles, prompts */
.backup p{margin:0;color:var(--muted);font-size:14.5px;max-width:76ch}
.backup .acts{display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--primary)}
.prompt{display:flex;flex-direction:column;gap:16px;padding:26px}
.prompt p{margin:0;color:var(--muted)}
.prompt .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(15,26,58,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(580px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.sheet form{display:flex;flex-direction:column;gap:18px;padding:26px}
.sheet header{display:flex;align-items:center;justify-content:space-between}
.sheet h2{font-size:22px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:14px;grid-column:1/-1}
.field.half{grid-column:auto}
.field i{font-style:normal;font-weight:500;color:var(--faint)}
.acts-rep{display:flex;flex-direction:column;gap:8px}
.acts-rep h3{margin:0;font-size:14px}
.act-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px}
.form-err{margin:0;color:var(--red);font-size:14px;font-weight:700}
.sheet footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;display:flex;gap:16px;align-items:center;font-size:14.5px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 18px 40px -14px rgba(15,26,58,.5)}
.toast .link{color:#9DB8FF;text-decoration:underline}

/* Steps, projects tag, repeat */
.row-below{flex-basis:100%;padding-left:38px;min-width:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.steps li.sdone span:last-child{text-decoration:line-through;color:var(--faint)}
.check.sm{width:20px;height:20px}
.check.sm span{border-radius:6px}
.check.sm input:checked+span::after{width:8px;height:4px}
.stepline{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.prog{display:inline-block;width:90px;height:6px;border-radius:4px;background:var(--fill-2);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--st-done);border-radius:4px}
.prog.lg{flex:1;width:auto;height:8px}
.focus-prog{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.proj{color:var(--violet);font-weight:600}
.rep{color:var(--primary);font-weight:600}
.projbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:-6px}
.pb-l{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;margin-right:4px;font-weight:700}
.pb-l svg{width:15px;height:15px}

/* Quick add */
#qaInput{font-size:18px;padding:14px 16px;border-radius:14px;height:auto}
.qa-preview{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;padding:14px 16px;border-radius:14px;background:var(--fill);font-size:14.5px}
.qa-preview .k{color:var(--faint);font-weight:600}
.qa-preview .v{overflow-wrap:anywhere;font-weight:600}
.qa-preview .v i{color:var(--faint);font-style:normal;font-weight:500}
.qa-preview .empty{grid-column:1/-1;margin:0}
.warn{color:var(--amber)}
.qa-hint{margin:0;font-size:13px;color:var(--faint)}
.qa-added{display:flex;gap:8px;align-items:center;color:var(--green);font-size:14px;margin:0;font-weight:600}
.qa-added svg{width:18px;height:18px}
.step-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}

/* Plan, wrap-up, search */
.picks{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--fill);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--st-done);flex:none}
.pk-t{flex:1;min-width:0;display:flex;flex-direction:column}
.pk-t b{font-weight:700;overflow-wrap:anywhere}
.pk-t small{color:var(--muted);font-size:13px}
.pick-count{margin:0;font-size:13.5px;color:var(--muted)}
.wrap-h{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.wrap-done{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wrap-done li{display:flex;gap:8px;align-items:center;font-size:14.5px}
.wrap-done svg{width:18px;height:18px;color:var(--st-done)}

const projectsList = () => [...new Set([...allItems().filter(i => i.kind === 'project' && i.status !== 'done').map(i => i.title), ...allItems().filter(i => PROJ_KINDS.has(i.kind) && i.project && !i.done).map(i => i.project)])].sort((a, b) => a.localeCompare(b));

const REPEATS = [['','Does not repeat'],['weekly','Weekly'],['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly']];
const REPEAT_LABEL = {weekly:'Weekly', monthly:'Monthly', quarterly:'Quarterly', yearly:'Yearly'};
function addMonths(s, n){ const [y, m, d] = s.split('-').map(Number); const last = new Date(y, m - 1 + n + 1, 0).getDate(); return ymd(new Date(y, m - 1 + n, Math.min(d, last))); }
function nextDue(due, rep){
  const step = {weekly:x => addDays(x, 7), monthly:x => addMonths(x, 1), quarterly:x => addMonths(x, 3), yearly:x => addMonths(x, 12)}[rep];
  if (!step || !due) return null;
  let d = step(due), guard = 0;
  while (d < today() && guard++ < 600) d = step(d);
  return d;
}
const itemDate = it => it.kind === 'meeting' ? it.date : it.kind === 'waiting' ? it.followup : it.due;

let chain = Promise.resolve();

function persist(id){
  lsSet('daybook.lastChange', String(Date.now()));
  if (S.mode !== 'db') { saveLocal(); renderBrand(); return; }
  pending.add(id);
  if (queued.has(id)) return;
  queued.add(id);
  chain = chain.then(async () => {
    queued.delete(id);
    const cur = S.items.get(id), ref = S.col.doc(id);
    try { if (cur) { const body = {...cur}; delete body.id; await ref.set(body); } else await ref.delete(); }
    catch (e) {
      toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete some old items, then try again.' : "That change didn't save. Check your connection and try again.");
    } finally { if (!queued.has(id)) pending.delete(id); }
  });
}

/* ---------- Backup and restore (Markdown) ---------- */
const MD_SECTIONS = [
  ['deadline','Deadlines',['due','category','notes']],
  ['project','Projects',['status','due','goal']],
  ['part','Project parts',['project','status','version','due','owner','reviewer','sentAt','notes']],
  ['task','Priorities',['quadrant','due','notes']],
  ['waiting','Waiting on',['who','asked','followup','lastChased','notes']],
  ['reading','Reading list',['status','source','link','why']],
  ['meeting','Meetings',['date','attendees','notes']],
  ['action','Action items',['owner','due','meeting']],
  ['week','Weekly plans',['week','wentWell','slipped','nextWeek']],
  ['focus','Focus sessions',['date']],
  ['day','Daily plans',['date','note']]
];
const CHECKABLE = ['deadline','task','waiting','action'];
const NUM_FIELDS = ['createdAt','updatedAt','version','order'];
const SKIP_FIELDS = ['id','kind','title','done','priorities','sessions','meetingId','example','steps','picks','wrapped','rounds'];
const esc1 = v => String(v ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n');
const unesc1 = v => String(v).replace(/\\(\\|n)/g, (m, c) => c === 'n' ? '\n' : '\\');
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function toMarkdown(items){
  const now = new Date();
  const out = [
    '# Daybook', '',
    `Exported ${today()} at ${hhmm(now)}`, '',
    '> Each item starts with "- " under its section. Details go on indented "  - field: value" lines.',
    '> Keep the id line so restoring updates the same item instead of adding a copy.',
    '> New items can be added by hand without an id.', ''
  ];
  for (const [kind, heading, order] of MD_SECTIONS) {
    const its = items.filter(i => i.kind === kind);
    if (!its.length) continue;
    out.push(`## ${heading}`, '');
    for (const it of its) {
      if (kind === 'week') out.push(`- Week ${esc1(it.week || it.id.replace(/^week-/, ''))}`);
      else if (kind === 'focus' || kind === 'day') out.push(`- ${esc1(it.date)}`);
      else out.push(`- ${CHECKABLE.includes(kind) ? (it.done ? '[x] ' : '[ ] ') : ''}${esc1(it.title)}`);
      const f = (k, v) => { if (v !== undefined && v !== null && v !== '') out.push(`  - ${k}: ${esc1(v)}`); };
      order.forEach(k => f(k, k === 'meeting' ? it.meetingId : it[k]));
      if (kind === 'week') (it.priorities || []).forEach(p => { if (p.text) out.push(`  - priority: [${p.done ? 'x' : ' '}] ${esc1(p.text)}`); });
      (it.rounds || []).forEach(r => {
        out.push(`  - round: ${r.n || ''} · ${r.date || ''} · ${esc1(r.from || '')} · v${r.version || ''}`);
        (r.items || []).forEach(x => out.push(`  - fix: [${x.done ? 'x' : ' '}] ${esc1(x.text)}`));
        if (r.sentBack) out.push(`  - sent: ${r.sentBack} · v${r.sentVersion || ''}`);
      });
      (it.steps || []).forEach(st => { if (st.text) out.push(`  - step: [${st.done ? 'x' : ' '}] ${esc1(st.text)}`); });
      if (kind === 'day') { (it.picks || []).forEach(p => out.push(`  - pick: ${esc1(p)}`)); if (it.wrapped) out.push('  - wrapped: yes'); }
      if (kind === 'focus') (it.sessions || []).forEach(s => out.push(`  - session: ${hhmm(s.at)} · ${s.minutes} min · ${esc1(s.project || 'General')}${s.ex ? ' · example' : ''}`));
      Object.keys(it).forEach(k => { if (!order.includes(k) && !SKIP_FIELDS.includes(k)) f(k, it[k]); });
      if (it.example) out.push('  - example: yes');
      out.push(`  - id: ${esc1(it.id)}`);
    }
    out.push('');
  }
  return out.join('\n');
}

function fromMarkdown(md){
  const byHeading = {};
  MD_SECTIONS.forEach(([k, h]) => { byHeading[h.toLowerCase()] = k; });
  byHeading['tasks'] = 'task'; byHeading['reading'] = 'reading'; byHeading['actions'] = 'action'; byHeading['focus'] = 'focus'; byHeading['weekly plan'] = 'week';
  const items = []; let kind = null, cur = null;
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, ''); let m;
    if ((m = line.match(/^#{2,3}\s+(.+)$/))) { kind = byHeading[m[1].trim().toLowerCase()] || null; cur = null; continue; }
    if (!kind) continue;
    if ((m = line.match(/^[-*] (?:\[( |x|X)\] )?(.+)$/))) {
      cur = {kind, title:unesc1(m[2].trim())};
      if (CHECKABLE.includes(kind)) cur.done = !!m[1] && m[1].toLowerCase() === 'x';
      if (kind === 'week') { cur.priorities = []; const w = cur.title.match(/(\d{4}-W\d{2})/); if (w) cur.week = w[1]; }
      if (kind === 'focus' || kind === 'day') { if (kind === 'focus') cur.sessions = []; else cur.picks = []; const d = cur.title.match(/(\d{4}-\d{2}-\d{2})/); if (d) cur.date = d[1]; }
      items.push(cur); continue;
    }
    if (cur && (m = line.match(/^\s+[-*] ([A-Za-z]+):\s?(.*)$/))) {
      const k = m[1], v = m[2];
      if (kind === 'week' && k === 'priority') { const p = v.match(/^\[( |x|X)\]\s?(.*)$/); cur.priorities.push(p ? {text:unesc1(p[2]), done:p[1].toLowerCase() === 'x'} : {text:unesc1(v), done:false}); }
      else if (kind === 'focus' && k === 'session') {
        const s = v.match(/^(\d{1,2}):(\d{2})\s*·\s*(\d+)\s*min\s*·\s*(.*?)(\s*·\s*example)?$/);
        if (s) cur.sessions.push({hh:+s[1], mm:+s[2], minutes:+s[3], project:unesc1(s[4]) || 'General', ex:!!s[5]});
      }
      else if (k === 'round') { const r = v.split(' · '); (cur.rounds = cur.rounds || []).push({n:Number(r[0]) || cur.rounds.length + 1, date:(r[1] || '').trim(), from:unesc1(r[2] || '').trim(), version:Number(String(r[3] || '').replace(/\D/g, '')) || 1, items:[], sentBack:'', sentVersion:0}); }
      else if (k === 'fix' && cur.rounds && cur.rounds.length) { const p = v.match(/^\[( |x|X)\]\s?(.*)$/); cur.rounds[cur.rounds.length - 1].items.push(p ? {text:unesc1(p[2]), done:p[1].toLowerCase() === 'x'} : {text:unesc1(v), done:false}); }
      else if (k === 'sent' && cur.rounds && cur.rounds.length) { const r = v.split(' · '), last = cur.rounds[cur.rounds.length - 1]; last.sentBack = (r[0] || '').trim(); last.sentVersion = Number(String(r[1] || '').replace(/\D/g, '')) || 0; }
      else if (k === 'step') { const p = v.match(/^\[( |x|X)\]\s?(.*)$/); (cur.steps = cur.steps || []).push(p ? {text:unesc1(p[2]), done:p[1].toLowerCase() === 'x'} : {text:unesc1(v), done:false}); }
      else if (kind === 'day' && k === 'pick') cur.picks.push(unesc1(v).trim());
      else if (k === 'wrapped') cur.wrapped = /^(yes|true)$/i.test(v);
      else if (k === 'meeting') cur.meetingId = unesc1(v);
      else if (k === 'example') cur.example = /^(yes|true)$/i.test(v);
      else if (NUM_FIELDS.includes(k)) cur[k] = Number(v) || 0;
      else cur[k] = unesc1(v);
    }
  }
  return items.map(it => {
    if (it.kind === 'week') {
      if (!it.week) return null;
      it.id = 'week-' + it.week; delete it.title;
      while (it.priorities.length < 3) it.priorities.push({text:'', done:false});
      it.priorities = it.priorities.slice(0, 3);
      ['wentWell','slipped','nextWeek'].forEach(k => { it[k] = it[k] || ''; });
    } else if (it.kind === 'focus') {
      if (!it.date) return null;
      it.id = 'focus-' + it.date; delete it.title;
      const base = parse(it.date);
      it.sessions = it.sessions.map(s => { const d = new Date(base); d.setHours(s.hh, s.mm, 0, 0); const o = {project:s.project, minutes:s.minutes, at:d.getTime()}; if (s.ex) o.ex = true; return o; });
    } else if (it.kind === 'part') {
      if (!it.title) return null;
      it.id = it.id || newId();
      it.status = PORDER.includes(it.status) ? it.status : 'todo';
      it.version = it.version || 1; it.rounds = it.rounds || [];
      it.done = it.status === 'done';
    } else if (it.kind === 'project') {
      if (!it.title) return null;
      it.id = it.id || newId();
      it.status = ['active','paused','done'].includes(it.status) ? it.status : 'active';
      it.done = false;
    } else if (it.kind === 'day') {
      if (!it.date) return null;
      it.id = 'day-' + it.date; delete it.title;
      it.note = it.note || ''; it.wrapped = !!it.wrapped;
    } else {
      if (!it.title) return null;
      it.id = it.id || newId();
      if (it.kind === 'reading' && !it.status) it.status = 'toread';
      if (it.kind === 'task' && !it.quadrant) it.quadrant = 'do';
    }
    it.createdAt = it.createdAt || Date.now();
    return it;
  }).filter(Boolean);
}

function appBridge(){ try { return (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.daybook) || null; } catch { return null; } }
function markSaved(){ lsSet('daybook.lastSavedAt', String(Date.now())); lsSet('daybook.lastBackup', today()); render(); }
const isUnsaved = () => Number(lsGet('daybook.lastChange') || 0) > Number(lsGet('daybook.lastSavedAt') || 0);
function exportData(){
  const data = toMarkdown(allItems());
  const filename = 'Daybook.md';
  const bridge = appBridge();
  if (bridge) {
    bridge.postMessage({filename, data});
    markSaved(); toast('Choose where to save your file'); return;
  }
  // On iPad and iPhone, the share sheet lets you "Save to Files" and replace the same Daybook.md each time.
  let file = null;
  try { file = new File([data], filename, {type:'text/plain'}); } catch {}
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (touch && file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file]})
      .then(() => { markSaved(); toast('Saved Daybook.md'); })
      .catch(e => { if (e && e.name === 'AbortError') toast('Not saved. Tap Save when you are ready.'); else downloadFile(data, filename); });
    return;
  }
  downloadFile(data, filename);
}
function downloadFile(data, filename){
  const blob = new Blob([data], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  markSaved(); toast('Saved Daybook.md to your downloads');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    let items = [];
    const text = String(r.result || '');
    if (/^\s*[\[{]/.test(text)) {
      try { const j = JSON.parse(text); items = Array.isArray(j) ? j : (j.items || []); } catch {}
    } else items = fromMarkdown(text);
    if (!items.length) { toast("No Daybook items found in that file. Choose a Markdown file saved from Daybook."); return; }
    let added = 0;
    items.forEach(it => {
      if (!it || !it.id || !it.kind) return;
      const cur = S.items.get(it.id);
      if (!cur || (it.updatedAt || 0) > (cur.updatedAt || 0)) { S.items.set(it.id, it); added++; }
    });
    migrateProjects(); saveLocal();
    if (!isUnsaved() || Number(lsGet('daybook.lastSavedAt') || 0) === 0) lsSet('daybook.lastSavedAt', String(Date.now()));
    render();
    toast(added ? `Loaded ${added} item${added === 1 ? '' : 's'} from ${file.name}` : `You're up to date with ${file.name}`);
  };
  r.readAsText(file);
}
document.addEventListener('change', e => {
  if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
});

function renderNav(){
  const t = today();
  const overdue = openOf('deadline').filter(d => diff(t, d.due) < 0).length;
  const counts = {
    deadlines: [overdue || openOf('deadline').filter(d => diff(t,d.due) <= 7).length, overdue > 0],
    priorities: [openOf('task').filter(x => x.quadrant === 'do').length],
    waiting: [openOf('waiting').length, openOf('waiting').some(w => w.followup && diff(t, w.followup) <= 0)],
    reading: [ofKind('reading').filter(r => r.status === 'reading').length],
    meetings: [openOf('action').length, openOf('action').some(a => a.due && diff(t,a.due) < 0)],
    projects: [ofKind('part').filter(p => p.status === 'revising').length, openOf('part').some(p => p.due && diff(t, p.due) < 0)]
  };
  $('#nav').innerHTML = NAV.map(([id,label,icon]) => {
    const c = counts[id];
    return `<button data-page="${id}" ${S.page === id ? 'aria-current="page"' : ''}>${icon}<span>${label}</span>${c && c[0] ? `<span class="badge ${c[1] ? 'hot' : ''}">${c[0]}</span>` : ''}</button>`;
  }).join('');
}

const pill = (cls, txt) => `<span class="pill ${cls}">${txt}</span>`;
function duePill(ds, prefix=''){
  if (!ds) return '';
  const d = diff(today(), ds);
  if (d < 0) return pill('red', `${prefix}${-d}d overdue`);
  if (d === 0) return pill('red', prefix ? `${prefix}today` : 'Today');
  if (d === 1) return pill('amber', prefix ? `${prefix}tomorrow` : 'Tomorrow');
  if (d <= 3) return pill('amber', `${prefix}${d} days`);
  if (d <= 14) return pill('blue', `${prefix}${d} days`);
  return pill('', d < 60 ? `${prefix}${Math.round(d/7)} wks` : fmt(ds, {day:'numeric', month:'short'}));
}
const exTag = it => it.example ? '<em class="ex">Example</em>' : '';
function row(it, {meta='', right='', check=true, below='', del=true} = {}){
  return `<li class="row ${it.done ? 'is-done' : ''}">
    ${check ? `<label class="check"><input type="checkbox" data-toggle="${h(it.id)}" ${it.done ? 'checked' : ''} aria-label="Mark ${h(it.title)} done"><span></span></label>` : ''}
    <button class="row-main" data-edit="${h(it.id)}"><span class="row-title">${h(it.title)}${exTag(it)}</span>${meta ? `<span class="row-meta">${meta}</span>` : ''}</button>
    ${right}
    ${del ? `<button class="icon-btn" data-del="${h(it.id)}" aria-label="Delete ${h(it.title)}">${I.trash}</button>` : ''}
    ${below ? `<div class="row-below">${below}</div>` : ''}
  </li>`;
}
const list = (items, fn, empty, icon='note') => items.length ? `<ul class="list">${items.map(fn).join('')}</ul>` : `<p class="empty">${I[icon] || I.note}<span>${empty}</span></p>`;
const TONE = {blue:'#2453D6', violet:'#7C3AED', green:'#16A34A', amber:'#D97706', red:'#DC2626', slate:'#64748B'};
const chip = (icon, tone='blue') => `<span class="ichip" style="--tc:${TONE[tone] || tone}">${I[icon] || I.note}</span>`;
const CARD_ICON = {'Coming up':['cal','blue'], 'Do now':['bolt','blue'], 'Action items':['list','blue'], 'This week':['cal','blue'], 'Waiting on':['clock','blue'],
  'Focus today':['target','blue'], 'Reading now':['book','violet'], 'Overdue':['alert','red'], 'Next two weeks':['cal','blue'], 'Later':['cal','slate'],

/* ---------- Apple Calendar (.ics) ---------- */
const icsEsc = v => String(v || '').replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line){ const out = []; while (line.length > 74) { out.push(line.slice(0, 74)); line = ' ' + line.slice(74); } out.push(line); return out.join('\r\n'); }
function toICS(items){
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Daybook//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  items.forEach(it => {
    const d = itemDate(it); if (!d) return;
    const pre = {deadline:'Due: ', action:'Action: ', waiting:'Chase: ', project:'Project due: '}[it.kind] || '';
    const rr = {weekly:'FREQ=WEEKLY', monthly:'FREQ=MONTHLY', quarterly:'FREQ=MONTHLY;INTERVAL=3', yearly:'FREQ=YEARLY'}[it.repeat];
    const desc = [it.kind === 'deadline' ? it.category : '', it.kind === 'part' ? `${PST[it.status || 'todo'][0]}, v${it.version || 1}` : '', it.kind === 'project' ? it.goal : '', it.project ? 'Project: ' + it.project : '', it.who ? 'From: ' + it.who : '', it.attendees ? 'With: ' + it.attendees : '', (it.steps || []).filter(x => x.text).map(x => (x.done ? '[x] ' : '[ ] ') + x.text).join('\n'), it.notes].filter(Boolean).join('\n');
    L.push('BEGIN:VEVENT', `UID:${it.id}@daybook`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(d, 1).replace(/-/g, '')}`, `SUMMARY:${icsEsc(pre + it.title + (it.kind === 'part' && it.project ? ` (${it.project})` : ''))}`);
    if (desc) L.push(`DESCRIPTION:${icsEsc(desc)}`);
    if (rr) L.push('RRULE:' + rr);
    L.push('TRANSP:TRANSPARENT', 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(pre + it.title)}`, 'TRIGGER:-PT15H', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function addToCalendar(items){
  const withDate = items.filter(itemDate);
  if (!withDate.length) { toast('Add a date first, then send it to Calendar'); return; }
  const data = toICS(withDate), filename = withDate.length === 1 ? 'daybook-event.ics' : 'daybook-deadlines.ics';
  const bridge = appBridge();
  if (bridge) { bridge.postMessage({filename, data}); return; }
  const url = URL.createObjectURL(new Blob([data], {type:'text/calendar'}));
  const a = document.createElement('a'); a.href = url;
  if (!(window.matchMedia && matchMedia('(pointer: coarse)').matches)) a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  toast(withDate.length === 1 ? 'Opening Calendar. Tap Add to keep it.' : `Sending ${withDate.length} items to Calendar. Tap Add All to keep them.`);
}

const PST = {todo:['Not started','slate'], drafting:['Drafting','blue'], review:['In review','amber'], revising:['Revising','violet'], done:['Done','green']};

const partsOf = name => allItems().filter(i => i.kind === 'part' && i.project === name)
  .sort((a, b) => (a.order ?? 1e9) - (b.order ?? 1e9) || (a.due || '9999').localeCompare(b.due || '9999') || (a.createdAt || 0) - (b.createdAt || 0));
function ensureProject(name, example, quiet){

}
function migrateProjects(){
  new Set(allItems().filter(i => PROJ_KINDS.has(i.kind) && i.project).map(i => i.project)).forEach(n => ensureProject(n, false, true));
}
function setPartStatus(p, st){ p.status = st; p.done = st === 'done'; p.doneAt = st === 'done' ? today() : ''; }
function closeWaiting(p){

}
function createWaiting(p, reviewer, days){

}
const lastSent = p => { const r = (p.rounds || []).filter(x => x.sentBack); return r.length ? r[r.length - 1].sentBack : (p.sentAt || ''); };
function partCounts(parts){ const c = {todo:0, drafting:0, review:0, revising:0, done:0}; parts.forEach(p => { c[p.status || 'todo']++; }); return c; }

const cloneItem = id => JSON.parse(JSON.stringify(S.items.get(id)));
function partAction(act, id, el){
  const p = cloneItem(id); if (!p) return;
  p.rounds = p.rounds || []; p.version = p.version || 1;
  const cur = p.rounds[p.rounds.length - 1];
  const sendCommon = (msg) => {
    const reviewer = ($('#pRev') && $('#pRev').value || '').trim(), days = Number($('#pChase') ? $('#pChase').value : 3), wait = $('#pWait') ? $('#pWait').checked : false;
    if (wait && !reviewer) { toast('Add who is reviewing it, or untick Waiting on'); $('#pRev').focus(); return false; }
    if (reviewer) p.reviewer = reviewer;
    p.sentAt = today(); setPartStatus(p, 'review');
    closeWaiting(p); p.waitingId = wait ? createWaiting(p, reviewer, days) : '';
    put(p); toast(msg + (wait ? `. Chase ${reviewer} on ${fmt(addDays(today(), days))}` : '')); return true;
  };
  switch (act) {
    case 'part-start': setPartStatus(p, 'drafting'); put(p); toast('Started drafting'); break;
    case 'part-send': if (!sendCommon(`Sent v${p.version} for review`)) return; break;
    case 'part-log': {
      const from = ($('#pFrom').value || '').trim() || p.reviewer || 'Reviewer';
      const date = $('#pDate').value || today();
      const items = ($('#pFixes').value || '').split(/\r?\n/).map(x => x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(Boolean).map(text => ({text, done:false}));
      p.rounds.push({n:p.rounds.length + 1, from, date, version:p.version, items, sentBack:'', sentVersion:0});
      p.reviewer = from; setPartStatus(p, 'revising'); closeWaiting(p); p.waitingId = '';
      put(p); toast(`Logged round ${p.rounds.length}${items.length ? ` with ${items.length} correction${items.length === 1 ? '' : 's'}` : ''}`); break;
    }
    case 'part-addfix': {
      const inp = $('#pNewFix'), text = (inp.value || '').trim(); if (!text) { inp.focus(); return; }
      if (!cur) p.rounds.push({n:1, from:p.reviewer || '', date:today(), version:p.version, items:[], sentBack:'', sentVersion:0});
      p.rounds[p.rounds.length - 1].items.push({text, done:false});
      put(p); refreshPart(id); setTimeout(() => { const f = $('#pNewFix'); if (f) f.focus(); }, 0); return;
    }
    case 'part-rmfix': { const [ri, fi] = el.dataset.i.split('|').map(Number); p.rounds[ri].items.splice(fi, 1); put(p); break; }
    case 'part-sendback': {
      const open = cur ? (cur.items || []).filter(x => !x.done).length : 0;
      if (cur) { cur.sentBack = today(); cur.sentVersion = p.version + 1; }
      p.version += 1;
      if (!sendCommon(`Sent back as v${p.version}${open ? ` with ${open} correction${open === 1 ? '' : 's'} still open` : ''}`)) return;
      break;
    }
    case 'part-done': setPartStatus(p, 'done'); closeWaiting(p); p.waitingId = ''; put(p); toast(`${p.title} is done`); break;
    case 'part-reopen': setPartStatus(p, 'revising'); put(p); toast('Reopened. Add the new corrections.'); break;
    case 'part-cal': addToCalendar([p]); return;
    case 'part-edit': closeSheet(); openSheet('part', id); return;
    case 'part-del': { const it = S.items.get(id); closeSheet(); removeMany([it], `Deleted “${it.title}”`); return; }
  }
  refreshPart(id);
}

/* ---------- Today helpers ---------- */
const KIND_WORD = {deadline:['deadline','deadlines'], task:['priority','priorities'], action:['action item','action items'], part:['project part','project parts']};
function kindsPhrase(items){
  const c = {}; items.forEach(i => { c[i.kind] = (c[i.kind] || 0) + 1; });
  const parts = Object.keys(KIND_WORD).filter(k => c[k]).map(k => `${c[k]} ${KIND_WORD[k][c[k] === 1 ? 0 : 1]}`);
  return parts.length <= 1 ? parts.join('') : parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
}
function greetSummary(dated){
  const t = today();
  const over = dated.filter(i => diff(t, i.due) < 0), tod = dated.filter(i => i.due === t), tom = dated.filter(i => diff(t, i.due) === 1);
  const seg = [];
  if (over.length) seg.push(`${kindsPhrase(over)} overdue`);
  if (tod.length) seg.push(`${kindsPhrase(tod)} due today`);
  if (!seg.length && tom.length) seg.push(`${kindsPhrase(tom)} due tomorrow`);
  if (seg.length) return `You have <b>${seg.join(' and ')}.</b>`;
  const next = dated.find(i => diff(t, i.due) > 1);
  return next ? `Nothing due today or tomorrow. Next up is <b>${h(next.title)}</b> on ${fmt(next.due)}.` : 'Nothing due right now. A good day to plan ahead.';
}
function upNextMeta(it){
  if (it.kind === 'deadline') return joinMeta('Deadline', h(it.category || 'Other'), repTag(it), projTag(it));
  if (it.kind === 'task') return joinMeta(it.quadrant === 'do' ? 'Priority' : 'Task', repTag(it), projTag(it));
  if (it.kind === 'action') return joinMeta('Action item', it.owner && it.owner !== 'Me' ? h(it.owner) : '', projTag(it));
  if (it.kind === 'part') return joinMeta('Project part', PST[it.status || 'todo'][0], projTag(it));
  return KIND_LABEL[it.kind] || '';
}
function upNextCard(dated){
  const t = today(), end = addDays(t, 6);
  const soon = dated.filter(i => i.due <= end);
  const shown = (soon.length ? soon : dated.slice(0, 3)).slice(0, 6);
  const first = shown[0];
  let sub = 'Nothing scheduled';
  if (first) {
    const n = diff(t, first.due), over = shown.filter(i => diff(t, i.due) < 0).length;
    sub = over ? `${over} overdue` : n === 0 ? `Due today, ${fmt(first.due, {weekday:'short', month:'short', day:'numeric'})}` : n === 1 ? `Due tomorrow, ${fmt(first.due, {weekday:'short', month:'short', day:'numeric'})}` : `Next due ${fmt(first.due, {weekday:'short', month:'short', day:'numeric'})}`;
  }
  const rest = soon.length - shown.length;
  const note = !dated.length ? 'Nothing with a due date yet. Tap New to add one.' : rest > 0 ? `${rest} more due by ${fmt(end, {weekday:'short', month:'short', day:'numeric'})}.` : soon.length ? `Nothing else due through ${fmt(end, {weekday:'short', month:'short', day:'numeric'})}.` : `Nothing due this week. These are the next things coming up.`;
  const rowsHtml = shown.length ? `<ul class="list">${shown.map(it => row(it, {meta: upNextMeta(it), right: duePill(it.due), del:false})).join('')}</ul>` : '';

/* ---------- Month calendar ---------- */
const CTYPE = {project:['Project due','var(--accent)'], part:['Project part','var(--violet)'], deadline:['Deadline','var(--accent)'], task:['Task','var(--amber)'], action:['Action item','var(--amber)'], chase:['Chase','var(--green)'], meeting:['Meeting','var(--muted)']};
function datedEntries(){
  const map = {};
  const add = (ds, type, it) => { if (ds) (map[ds] = map[ds] || []).push({type, it}); };
  all().forEach(i => {
    if (i.kind === 'deadline') add(i.due, 'deadline', i);
    else if (i.kind === 'task' || i.kind === 'action') add(i.due, i.kind, i);
    else if (i.kind === 'waiting' && !i.done) add(i.followup, 'chase', i);
    else if (i.kind === 'meeting') add(i.date, 'meeting', i);
    else if (i.kind === 'part') add(i.due, 'part', i);
    else if (i.kind === 'project' && i.status !== 'done') add(i.due, 'project', i);
  });
  const order = ['project','deadline','part','meeting','task','action','chase'];
  Object.values(map).forEach(a => a.sort((x,y) => order.indexOf(x.type) - order.indexOf(y.type)));
  return map;
}
function agendaRow({type, it}){
  const [label, c] = CTYPE[type];

  if (type === 'project') return `<li class="row"><button class="row-main" data-openproj="${h(it.id)}"><span class="row-title">${h(it.title)}${exTag(it)}</span><span class="row-meta">${lab} · ${partsOf(it.title).filter(p => p.done).length}/${partsOf(it.title).length} parts done</span></button></li>`;
  if (type === 'part') return row(it, {meta: `${lab} · ${PST[it.status || 'todo'][0]} · v${it.version || 1}${it.project ? ' · ' + projTag(it) : ''}`});
  if (type === 'meeting') return `<li class="row"><button class="row-main" data-edit="${h(it.id)}"><span class="row-title">${h(it.title)}${exTag(it)}</span><span class="row-meta">${lab}${it.attendees ? ' · With ' + h(it.attendees) : ''}</span></button></li>`;
  const extra = type === 'deadline' ? h(it.category || '') : type === 'chase' ? 'From ' + h(it.who) : type === 'action' && it.owner ? h(it.owner) : '';
  return row(it, {meta: `${lab}${extra ? ' · ' + extra : ''}`});
}
function calendarCard(){
  const t = today(), map = datedEntries();
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = `${y}-${pad(m)}-01`;
  const last = ymd(new Date(y, m, 0));
  let cur = mondayOf(first);
  let cells = `<span></span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<span class="dh">${d.slice(0,1)}<span class="sr">${d.slice(1)}</span></span>`).join('')}`;
  while (cur <= last) {
    cells += `<span class="wk" title="ISO week">${isoWeek(parse(cur)).w}</span>`;
    for (let i = 0; i < 7; i++) {
      const ds = addDays(cur, i), es = map[ds] || [];
      const open = es.filter(e => !e.it.done || e.type === 'meeting');
      const out = ds.slice(0,7) !== S.calMonth;
      const cls = ['cday', out ? 'out' : '', es.some(e => (e.type === 'deadline' || e.type === 'project') && !e.it.done) ? 'dl' : '',
        ds < t && open.some(e => e.type !== 'meeting') ? 'late' : '', ds === t ? 'today' : '', ds === S.calSel ? 'sel' : ''].join(' ');
      const types = [...new Set(open.map(e => e.type === 'action' ? 'task' : e.type))];
      const dots = types.slice(0,3).map(tp => `<i style="--c:${CTYPE[tp][1]}"></i>`).join('') + (types.length > 3 ? '<em>+</em>' : '');
      const label = `${fmt(ds, {weekday:'long', day:'numeric', month:'long'})}${es.length ? `, ${es.length} item${es.length === 1 ? '' : 's'}` : ''}`;
      cells += `<button class="${cls}" data-calday="${ds}" aria-label="${h(label)}" ${ds === S.calSel ? 'aria-pressed="true"' : ''}><span class="dn">${parse(ds).getDate()}</span><span class="dots">${dots}</span></button>`;
    }
    cur = addDays(cur, 7);
  }
  const sel = map[S.calSel] || [];
  const monthName = parse(first).toLocaleDateString(undefined, {month:'long', year:'numeric'});
  const isThisMonth = S.calMonth === t.slice(0,7);
  return `<section class="card">
    <div class="cal-head"><div class="ch-left">${chip('cal','blue')}<h2>${monthName}</h2></div>
      <div class="mnav">${isThisMonth ? '' : `<button class="btn ghost" style="padding:6px 10px;font-size:13px" data-act="cal-today">Today</button>`}<button class="icon-btn" data-act="cal-prev" aria-label="Previous month">${I.left}</button><button class="icon-btn" data-act="cal-next" aria-label="Next month">${I.right}</button></div></div>
    <div class="cal-wrap">
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="cal">${cells}</div>
        <div class="legend"><span style="--c:var(--accent)"><i></i>Deliverable</span><span style="--c:var(--violet)"><i></i>Project part</span><span style="--c:var(--amber)"><i></i>Task or action</span><span style="--c:var(--green)"><i></i>Chase</span><span style="--c:var(--muted)"><i></i>Meeting</span></div>
      </div>
      <div class="agenda">
        <h3>${S.calSel === t ? 'Today, ' : ''}${fmt(S.calSel, {weekday:'long', day:'numeric', month:'long'})}</h3>
        ${list(sel, agendaRow, 'Nothing due this day.')}
        <div>${addBtn('deadline', 'Add deadline on this day', {due:S.calSel}).replace('btn primary', 'btn ghost')}</div>
      </div>
    </div>
  </section>`;
}

/* ---------- Pages ---------- */
const PAGES = {
today(){
  const t = today(), D = new Date(), {w} = isoWeek(D), q = Math.floor(D.getMonth()/3) + 1, hr = D.getHours();
  const greet = (hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening') + (S.name ? `, ${h(S.name)}` : '');
  const dated = [...openOf('deadline'), ...openOf('task'), ...openOf('action'), ...openOf('part')].filter(i => i.due).sort(byDue);
  const overdue = dated.filter(i => diff(t, i.due) < 0);
  const due7 = openOf('deadline').filter(d => { const n = diff(t, d.due); return n >= 0 && n <= 7; });
  const waiting = openOf('waiting');
  const actions = openOf('action');
  const key = weekKeyOf(t), wk = weekDoc(key);
  const fToday = sumObj(focusByDay(t, t));
  const hasEx = all().some(i => i.example || (i.sessions || []).some(s => s.ex));

  let out = head(fmt(t, {weekday:'long', day:'numeric', month:'long'}), `${greet}. ${S.items.size ? greetSummary(dated) : 'Let’s get your week set up.'}`, '', `Week ${w} · Q${q} ${D.getFullYear()}`);

  if (!S.items.size) {
    return out + `<section class="welcome"><h2>Set up your Daybook</h2>
      <p>Add your first deadline, or load a set of example items to see how each page works. Examples are labelled and you can clear them in one tap.</p>
      <div class="acts">${addBtn('deadline','Add a deadline')}<button class="btn ghost" data-act="examples">Load examples</button><button class="btn ghost" data-act="import">Load a file</button></div></section>`;
  }
  if (hasEx) out += `<div class="banner"><span>Some items here are examples.</span><button class="btn ghost" data-act="clear-examples">Clear examples</button></div>`;

  const tile = (n, label, icon, page, alert) => `<button class="tile ${n ? (alert ? 'alert' : 'on') : ''}" data-page="${page}">${chip(icon)}<b>${n}</b><span class="l">${label}</span></button>`;
  out += `<div class="tiles">${tile(overdue.length, 'Overdue', 'alert', 'deadlines', true)}${tile(due7.length, 'Due in 7 days', 'cal', 'deadlines')}${tile(waiting.length, 'Waiting on', 'hour', 'waiting')}${tile(actions.length, 'Open actions', 'list', 'meetings')}</div>`;

  const prios = wk.priorities.filter(p => p.text);
  const prioHtml = prios.length ? `<ul class="list">${wk.priorities.map((p,i) => p.text ? `<li class="row ${p.done ? 'is-done' : ''}"><label class="check"><input type="checkbox" data-wkcheck="${i}" data-wk="${key}" ${p.done ? 'checked' : ''} aria-label="Mark priority done"><span></span></label><span class="row-main"><span class="row-title">${h(p.text)}</span></span></li>` : '').join('')}</ul>`
    : `<p class="card-note">Pick up to three things that would make this week a win.</p><button class="btn primary block" data-page="week">Set three priorities</button>`;
  const weekTotal = sumObj(focusByDay(mondayOf(t), t));
  const focusBody = `<div class="bigstat"><div><b>${mins(fToday)}</b><span>Today</span></div><div><b>${mins(weekTotal)}</b><span>This week</span></div></div><button class="btn outline block" data-page="focus">${I.play}<span>${T.running ? 'Go to the timer' : 'Start a session'}</span></button>`;
  const hasPlan = (dayDoc(t).picks || []).some(id => S.items.get(id));

  out += `<div class="today-grid">
    <div class="col">
      ${upNextCard(dated)}
      ${hasPlan ? focusCard() : ''}
      ${summaryCard()}
    </div>
    <div class="col">
      ${card('Focus', focusBody, '', 'target')}
      ${card('This week', prioHtml, `<button class="link" data-page="week">Weekly plan</button>`)}
      ${activeProjectsCard()}
    </div>
  </div>`;
  return out + calendarCard() + backupCard();
},

projects(){
  const pr = S.openProject && S.items.get(S.openProject);
  return pr ? projectDetail(pr) : projectsList_page();
},

deadlines(){
  const t = today();
  const items = ofKind('deadline');
  const cats = ['All', ...CATS.filter(c => items.some(i => (i.category || 'Other') === c))];
  if (!cats.includes(S.dcat)) S.dcat = 'All';
  const f = i => S.dcat === 'All' || (i.category || 'Other') === S.dcat;
  const open = items.filter(i => !i.done && f(i)).sort(byDue);
  const done = items.filter(i => i.done && f(i)).sort((a,b) => (b.due || '').localeCompare(a.due || ''));
  const overdue = open.filter(i => diff(t, i.due) < 0), soon = open.filter(i => { const n = diff(t,i.due); return n >= 0 && n <= 14; }), later = open.filter(i => diff(t, i.due) > 14);
  let out = head('Deadlines', 'Reports, referee reports, grants and submissions, sorted by how soon they land.', `<div style="display:flex;gap:8px;flex-wrap:wrap">${open.length ? `<button class="btn ghost" data-act="cal-all">${I.cal}<span>Add all to Calendar</span></button>` : ''}${addBtn('deadline','Add deadline')}</div>`);
  if (cats.length > 2) out += `<div class="chips">${cats.map(c => `<button class="chip" data-dcat="${h(c)}" aria-pressed="${S.dcat === c}">${h(c)}</button>`).join('')}</div>`;
  if (!open.length && !done.length) return out + card('Nothing yet', `<p class="empty">Add your first deadline and it will count down here.</p>`);
  if (overdue.length) out += card('Overdue', list(overdue, deadlineRowFull, ''), `<span class="count">${overdue.length}</span>`);
  out += card('Next two weeks', list(soon, deadlineRowFull, 'Nothing due in the next two weeks.'), `<span class="count">${soon.length}</span>`);
  if (later.length) out += card('Later', list(later, deadlineRowFull, ''), `<span class="count">${later.length}</span>`);
  if (done.length) out += `<section class="card"><details class="done-list"><summary>Completed (${done.length})</summary>${list(done, deadlineRow, '')}</details></section>`;
  return out;
},

priorities(){
  const tasks = ofKind('task');
  const anyDone = tasks.some(t => t.done);
  let out = head('Priorities', 'Sort tasks by urgency and importance. Tap a task to move it to another box.',
    `<div style="display:flex;gap:8px;flex-wrap:wrap">${anyDone ? `<button class="btn ghost" data-act="clear-done">Clear done</button>` : ''}${addBtn('task','Add task')}</div>`);
  out += `<div class="axis"><span>Urgent</span><span>Not urgent</span></div><div class="matrix">`;
  ['do','plan','delegate','drop'].forEach(qid => {
    const q = QUADS.find(x => x.id === qid);
    const its = tasks.filter(t => (t.quadrant || 'do') === qid).sort((a,b) => (a.done - b.done) || byDue(a,b));
    const qt = {do:['bolt','red'], plan:['cal','blue'], delegate:['users','amber'], drop:['x','slate']}[qid];
    out += `<section class="card quad" style="--tc:${TONE[qt[1]]}"><div class="card-h"><div class="ch-left">${chip(qt[0], qt[1])}<div><h2>${q.name}</h2><p>${q.sub}</p></div></div><button class="icon-btn" data-add="task" data-preset="${h(JSON.stringify({quadrant:qid}))}" aria-label="Add to ${q.name}">${I.plus}</button></div>
      ${list(its, taskRow, 'Empty')}</section>`;
  });
  return out + `</div>`;
},

waiting(){
  const items = ofKind('waiting');
  const open = items.filter(i => !i.done).sort((a,b) => (a.followup || '9999').localeCompare(b.followup || '9999'));
  const done = items.filter(i => i.done);
  const chaseNow = open.filter(i => i.followup && diff(today(), i.followup) <= 0);
  let out = head('Waiting on', 'Data, sign-offs and replies you have asked others for. Tick an item when it arrives.', addBtn('waiting','Add item'));
  if (!items.length) return out + card('Nothing yet', `<p class="empty">Add something you're waiting on, and set a date to chase it.</p>`);
  if (chaseNow.length) out += card('Chase now', list(chaseNow, waitingRow, ''), `<span class="count">${chaseNow.length}</span>`);
  const rest = open.filter(i => !chaseNow.includes(i));
  out += card(chaseNow.length ? 'Still waiting' : 'Open', list(rest, waitingRow, 'Nothing else outstanding.'), `<span class="count">${rest.length}</span>`);
  if (done.length) out += `<section class="card"><details class="done-list"><summary>Received (${done.length})</summary>${list(done, waitingRow, '')}</details></section>`;
  return out;
},

reading(){
  const items = ofKind('reading');
  const cnt = s => items.filter(i => (i.status || 'toread') === s).length;
  const shown = items.filter(i => (i.status || 'toread') === S.rfilter).sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  let out = head('Reading list', 'Papers, reports and articles, with a note on why each one matters.', addBtn('reading','Add reading', {status:S.rfilter}));
  out += `<div class="chips">${RSTAT.map(([k,l]) => `<button class="chip" data-rfilter="${k}" aria-pressed="${S.rfilter === k}">${l}<span class="n">${cnt(k)}</span></button>`).join('')}</div>`;
  if (!shown.length) return out + card('Nothing here', `<p class="empty">${items.length ? 'No items with this status.' : 'Add a paper or report you want to get to.'}</p>`);
  return out + `<div class="rgrid">${shown.map(r => `<article class="card rcard">
    <button class="title-btn" data-edit="${h(r.id)}">${h(r.title)}${exTag(r)}</button>
    ${r.source || r.project ? `<p class="src">${joinMeta(r.source ? h(r.source) : '', projTag(r))}</p>` : ''}
    ${r.why ? `<p class="why">${h(r.why)}</p>` : ''}
    <div class="foot">
      <select class="mini" data-status="${h(r.id)}" aria-label="Status">${RSTAT.map(([k,l]) => `<option value="${k}" ${(r.status || 'toread') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${/^https?:\/\//i.test(r.link || '') ? `<a class="ext" href="${h(r.link)}" target="_blank" rel="noopener">Open ${I.ext}</a>` : ''}
      <span class="grow"></span>
      <button class="icon-btn" data-del="${h(r.id)}" aria-label="Delete">${I.trash}</button>
    </div></article>`).join('')}</div>`;
},

meetings(){
  const mtgs = ofKind('meeting').sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  const acts = ofKind('action');
  const open = acts.filter(a => !a.done).sort(byDue);
  let out = head('Meetings', 'Log a meeting and its action items. Every open action item is collected at the top.', addBtn('meeting','Log meeting'));
  out += card('Open action items', list(open, actionRow, 'No open action items.'), `<div style="display:flex;align-items:center;gap:6px"><span class="count">${open.length}</span><button class="icon-btn" data-add="action" aria-label="Add action item">${I.plus}</button></div>`);
  if (!mtgs.length) return out + card('No meetings yet', `<p class="empty">Log your next meeting to keep notes and action items together.</p>`);
  out += `<div class="grid2">` + mtgs.map(m => {
    const its = acts.filter(a => a.meetingId === m.id).sort((a,b) => (a.done - b.done) || byDue(a,b));
    return `<article class="card mtg">
      <div class="card-h"><div class="ch-left">${chip('users','violet')}<div><p class="when">${fmt(m.date, {weekday:'short', day:'numeric', month:'short', year:'numeric'})}</p><h2><button class="row-main" style="font:inherit" data-edit="${h(m.id)}">${h(m.title)}${exTag(m)}</button></h2></div></div>
      <button class="icon-btn" data-del="${h(m.id)}" aria-label="Delete meeting">${I.trash}</button></div>
      ${m.attendees || m.project ? `<p class="who">${joinMeta(m.attendees ? 'With ' + h(m.attendees) : '', projTag(m))}</p>` : ''}
      ${m.notes ? `<p class="notes">${h(m.notes)}</p>` : ''}
      ${its.length ? list(its, actionRow, '') : ''}
      <div><button class="link" data-add="action" data-preset="${h(JSON.stringify({meetingId:m.id}))}">+ Add action item</button></div>
    </article>`;
  }).join('') + `</div>`;
  return out;
},

week(){
  const mon = S.weekStart, sun = addDays(mon, 6), key = weekKeyOf(mon), wk = weekDoc(key);
  const {w, y} = isoWeek(parse(mon));
  const isNow = mon === mondayOf(today());
  const dl = ofKind('deadline').filter(d => d.due >= mon && d.due <= sun).sort(byDue);
  const fm = sumObj(focusByDay(mon, sun));
  const nav = `<div class="weeknav"><button class="icon-btn" data-act="week-prev" aria-label="Previous week">${I.left}</button><span class="lbl">Week ${w} · ${fmt(mon, {day:'numeric', month:'short'})} – ${fmt(sun, {day:'numeric', month:'short'})}</span><button class="icon-btn" data-act="week-next" aria-label="Next week">${I.right}</button>${isNow ? '' : `<button class="btn ghost" data-act="week-now">This week</button>`}</div>`;
  let out = head('Weekly plan', 'Pick three priorities on Monday. Look back on Friday.', nav, `${y} · Week ${w}`);
  out += `<div class="grid2"><section class="card"><div class="card-h"><div class="ch-left">${chip('checkc','blue')}<h2>Three priorities</h2></div>${exTag(wk)}</div><div class="prios">` +
    wk.priorities.map((p,i) => `<div class="prio ${p.done ? 'is-done' : ''}"><span class="num">${i+1}</span><input type="text" id="wp-${i}" data-wktext="${i}" data-wk="${key}" value="${h(p.text)}" placeholder="Priority ${i+1}" aria-label="Priority ${i+1}"><label class="check"><input type="checkbox" data-wkcheck="${i}" data-wk="${key}" ${p.done ? 'checked' : ''} aria-label="Mark priority ${i+1} done"><span></span></label></div>`).join('') +
    `</div></section>` +
    card('This week at a glance', `${list(dl, deadlineRow, 'No deadlines this week.')}<div class="bigstat"><div><b>${mins(fm)}</b><span>focused this week</span></div><div><b>${wk.priorities.filter(p => p.done && p.text).length}/${wk.priorities.filter(p => p.text).length || 3}</b><span>priorities done</span></div></div>`) +
    `</div>`;
  out += `<section class="card review"><div class="card-h"><div class="ch-left">${chip('note','violet')}<h2>Friday review</h2></div></div><div class="grid2">
    <label>What went well<textarea id="wr-well" data-wkfield="wentWell" data-wk="${key}" placeholder="Wins, finished work, good calls">${h(wk.wentWell)}</textarea></label>
    <label>What slipped, and why<textarea id="wr-slip" data-wkfield="slipped" data-wk="${key}" placeholder="What didn't get done">${h(wk.slipped)}</textarea></label>
    <label>Carry into next week<textarea id="wr-next" data-wkfield="nextWeek" data-wk="${key}" placeholder="Priorities to roll forward">${h(wk.nextWeek)}</textarea></label>
  </div></section>`;
  return out;
},

focus(){
  const t = today(), mon = mondayOf(t), sun = addDays(mon, 6);
  const days = focusByDay(mon, sun), byP = focusByProject(mon, sun);
  const max = Math.max(1, ...Object.values(days));
  const projects = [...new Set(ofKind('focus').flatMap(f => (f.sessions || []).map(s => s.project)).filter(Boolean)), ...openOf('deadline').map(d => d.title)].slice(0, 20);
  const todaySessions = (S.items.get('focus-' + t)?.sessions || []).slice().reverse();
  const pMax = Math.max(1, ...byP.map(p => p[1]));
  let out = head('Focus timer', 'Work in focused blocks and log where the time goes.');
  out += `<section class="card"><div class="focus-top">
    <div class="ring" id="tRing"><div class="ring-in"><span class="digits" id="tDigits">25:00</span><small id="tLabel"></small></div></div>
    <div class="fctl">
      <label for="tProject">Working on<input type="text" id="tProject" list="tProjects" value="${h(T.project)}" placeholder="e.g. Quarterly review"></label>
      <datalist id="tProjects">${projects.map(p => `<option value="${h(p)}">`).join('')}</datalist>
      <div><div style="font-weight:600;font-size:14px;margin-bottom:6px">Length</div><div class="chips">${[25,50,90].map(m => `<button class="chip" data-act="t-dur" data-v="${m}" aria-pressed="${T.dur === m}" ${T.running ? 'disabled' : ''}>${m} min</button>`).join('')}</div></div>
      <div class="btns">
        <button class="btn primary" data-act="${T.running ? 't-pause' : 't-start'}">${T.running ? 'Pause' : (T.remaining < T.dur*60e3 ? 'Resume' : 'Start')}</button>
        <button class="btn ghost" data-act="t-finish" ${T.remaining >= T.dur*60e3 && !T.running ? 'disabled' : ''}>Finish and log</button>
        <button class="btn ghost" data-act="t-reset">Reset</button>
      </div>
    </div></div></section>`;
  out += `<div class="grid2">` + card('This week', `<div class="cols" role="img" aria-label="Focus minutes per day this week">${[0,1,2,3,4,5,6].map(i => { const d = addDays(mon, i), m = days[d] || 0; return `<div class="c ${m ? '' : 'zero'} ${d === t ? 'today' : ''}"><em>${m ? m : ''}</em><i style="height:${Math.max(2, Math.round(m / max * 100))}%"></i><span>${fmt(d, {weekday:'narrow'})}</span></div>`; }).join('')}</div><div class="bigstat"><div><b>${mins(days[t] || 0)}</b><span>today</span></div><div><b>${mins(sumObj(days))}</b><span>this week</span></div></div>`) +
    card('By project this week', byP.length ? `<div class="bars">${byP.map(([p,m]) => `<div class="b"><span>${h(p)}</span><em>${mins(m)}</em><div class="track"><i style="width:${Math.round(m / pMax * 100)}%"></i></div></div>`).join('')}</div>` : `<p class="empty">Finish a session to see your time by project.</p>`) + `</div>`;
  out += card("Today's sessions", todaySessions.length ? `<ul class="list">${todaySessions.map(s => `<li class="row"><span class="row-main"><span class="row-title">${h(s.project || 'General')}${s.ex ? '<em class="ex">Example</em>' : ''}</span><span class="row-meta">${new Date(s.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</span></span>${pill('blue', mins(s.minutes))}</li>`).join('')}</ul>` : `<p class="empty">No sessions yet today.</p>`);
  return out;
}
};

const T = Object.assign({dur:25, project:'', running:false, endsAt:0, remaining:25*60e3}, (() => { try { return JSON.parse(lsGet('daybook.timer') || '{}'); } catch { return {}; } })());

let actx = null, lock = null;
function chime(){
  try {
    if (!actx) return;
    [0, .22, .44].forEach((dt, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = [660, 880, 990][i]; o.type = 'sine';
      g.gain.setValueAtTime(.0001, actx.currentTime + dt); g.gain.exponentialRampToValueAtTime(.2, actx.currentTime + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dt + .35);

    });
  } catch {}
}

  const t = today(), id = 'focus-' + t, cur = S.items.get(id) || {id, kind:'focus', date:t, sessions:[]};

}

  const left = tLeft(), mm = Math.floor(left / 60e3), ss = Math.floor((left % 60e3) / 1e3), txt = `${pad(mm)}:${pad(ss)}`;
  const d = $('#tDigits'); if (d) d.textContent = txt;
  const r = $('#tRing'); if (r) r.style.setProperty('--p', String(1 - left / (T.dur * 60e3)));

  $('#railLabel').textContent = T.running ? (T.project || 'Focusing') : active ? 'Paused' : `${T.dur} min session`;

  }
}
