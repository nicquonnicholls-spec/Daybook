<style>
/* Layout: deep-ink navigation rail beside a scrolling workspace of cards; on phones the rail becomes a sticky, swipeable tab strip */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#F3F5F9; --line:#DDE2EB;
  --ink:#131A2A; --muted:#5B6579; --faint:#8A93A5;
  --accent:#2C49D6; --accent-ink:#FFFFFF; --accent-soft:#E3E8FD;
  --rail:#121A33; --rail-ink:#A9B4D4; --rail-hi:#FFFFFF; --rail-active:#24315F; --rail-line:#232C4A;
  --red:#C1373A; --red-soft:#FBE7E7; --amber:#8F5B00; --amber-soft:#FCEED0; --green:#1C7547; --green-soft:#DCF1E4;
  --shadow:0 1px 2px rgba(19,26,42,.05),0 8px 24px -12px rgba(19,26,42,.14);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1017; --surface:#141A24; --sunk:#1A2130; --line:#263043;
  --ink:#E7EBF3; --muted:#9AA5BA; --faint:#6E7990;
  --accent:#8EA1FF; --accent-ink:#0C1017; --accent-soft:#222B4E;
  --rail:#080B12; --rail-ink:#8D98B6; --rail-hi:#F1F4FA; --rail-active:#1C2546; --rail-line:#1A2134;
  --red:#FF8B8D; --red-soft:#3A1C22; --amber:#F2BE5A; --amber-soft:#3A2D15; --green:#71D7A0; --green-soft:#15302A;
  --shadow:0 1px 0 rgba(255,255,255,.03);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1017; --surface:#141A24; --sunk:#1A2130; --line:#263043;
  --ink:#E7EBF3; --muted:#9AA5BA; --faint:#6E7990;
  --accent:#8EA1FF; --accent-ink:#0C1017; --accent-soft:#222B4E;
  --rail:#080B12; --rail-ink:#8D98B6; --rail-hi:#F1F4FA; --rail-active:#1C2546; --rail-line:#1A2134;
  --red:#FF8B8D; --red-soft:#3A1C22; --amber:#F2BE5A; --amber-soft:#3A2D15; --green:#71D7A0; --green-soft:#15302A;
  --shadow:0 1px 0 rgba(255,255,255,.03);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* Rail */
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:24px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;align-items:center;gap:12px;padding-inline:8px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:18px}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--rail-hi);letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--rail-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;color:var(--rail-ink);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{color:var(--rail-hi);background:color-mix(in srgb,var(--rail-active) 60%,transparent)}
.nav button[aria-current="page"]{background:var(--rail-active);color:var(--rail-hi)}
.nav .badge{margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--rail-line);color:var(--rail-hi)}
.nav .badge.hot{background:var(--red);color:#fff}
.rail-actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.save-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--rail-line);background:none;color:var(--rail-hi);text-align:left}
.save-btn:hover{background:var(--rail-active)}
.save-btn .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.save-btn .t b{font-weight:600;font-size:14px}
.save-btn .t small{font-size:12px;color:var(--rail-ink)}
.save-btn.unsaved{border-color:var(--amber)}
.save-btn.unsaved .t small{color:var(--amber)}
.save-btn .dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.save-btn.unsaved .dot{display:block}
.rail-timer{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--rail-active);color:var(--rail-hi);border:0;font-family:var(--f-mono);font-size:14px;width:100%}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.prompt{display:flex;flex-direction:column;gap:14px;padding:22px}
.prompt p{margin:0;color:var(--muted)}
.prompt .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.rail-timer .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.rail-timer.paused .dot{background:var(--amber)}

/* Main */
.main{min-width:0;padding-block:32px 72px;padding-left:44px;padding-right:max(44px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);max-width:62ch}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0}
.loading{color:var(--muted);padding:40px 0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 14px;font-weight:600;border:1px solid transparent;background:var(--sunk);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:none;color:var(--faint);flex:none}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
.link:hover{text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.75}

/* Cards and lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-h .count{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list .row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;border:0;background:none;padding:0;text-align:left}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row.is-done .row-title{text-decoration:line-through;color:var(--faint);font-weight:500}
.ex{white-space:nowrap;font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border:1px dashed var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:500}
.empty{color:var(--faint);font-size:14px;margin:4px 0}
.check{position:relative;flex:none;width:22px;height:22px}
.check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.check span{position:absolute;inset:0;border-radius:7px;border:1.8px solid var(--faint);display:grid;place-items:center;transition:background .15s}
.check input:checked+span{background:var(--green);border-color:var(--green)}
.check input:checked+span::after{content:"";width:9px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pill{flex:none;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.green{background:var(--green-soft);color:var(--green)}
details.done-list summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;padding:6px 0}

/* Stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);font-weight:500}
.tile.alert b{color:var(--red)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.welcome h2{font-size:24px}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap}

/* Priority matrix */
.axis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-inline:4px}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.quad{border-top:4px solid var(--q)}
.quad .card-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.q-do{--q:var(--red)} .q-plan{--q:var(--accent)} .q-delegate{--q:var(--amber)} .q-drop{--q:var(--faint)}

/* Reading cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.rcard .src{font-size:13px;color:var(--muted);margin:0}
.rcard .why{margin:0;font-size:14px;overflow-wrap:anywhere}
.rcard .foot{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.rcard .title-btn{border:0;background:none;padding:0;text-align:left;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.ext{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
select.mini{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:600}

/* Meetings */
.mtg .when{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin:0}
.mtg .who{font-size:13px;color:var(--muted);margin:0}
.mtg .notes{margin:0;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.owner{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}

/* Week */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .lbl{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:0 6px;font-variant-numeric:tabular-nums}
.prio{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.prio:first-of-type{border-top:0}
.prio .num{font-family:var(--f-mono);font-weight:600;color:var(--faint);width:18px}
.prio input[type=text]{flex:1;min-width:0;border:0;background:none;padding:6px 0;font-weight:600;font-size:16px;border-bottom:1px dashed transparent}
.prio input[type=text]:focus{outline:none;border-bottom-color:var(--accent)}
.prio.is-done input[type=text]{text-decoration:line-through;color:var(--faint)}
.review label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
textarea,input[type=text],input[type=date],input[type=url],select{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}

/* Focus */
.focus-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:center}
.ring{width:100%;max-width:280px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0) * 1turn),var(--sunk) 0);display:grid;place-items:center;margin-inline:auto}
.ring-in{width:calc(100% - 22px);aspect-ratio:1;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.digits{font-family:var(--f-mono);font-weight:600;font-size:clamp(40px,8vw,56px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.ring-in small{color:var(--muted);font-size:13px;max-width:80%;text-align:center;overflow-wrap:anywhere}
.fctl{display:flex;flex-direction:column;gap:14px}
.fctl .btns{display:flex;gap:10px;flex-wrap:wrap}
.fctl label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.bars .b span{overflow-wrap:anywhere}
.bars .b em{font-style:normal;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bars .track{grid-column:1/-1;height:8px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cols .c i{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
.cols .c.zero i{background:var(--line)}
.cols .c.today i{background:var(--green)}
.cols .c em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cols .c span{font-size:12px;color:var(--faint);font-weight:600}
.bigstat{display:flex;gap:28px;flex-wrap:wrap}
.bigstat div b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.bigstat div span{font-size:13px;color:var(--muted)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(8,11,18,.5)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.sheet form{display:flex;flex-direction:column;gap:16px;padding:20px}
.sheet header{display:flex;align-items:center;justify-content:space-between}
.sheet h2{font-size:21px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px;grid-column:1/-1}
.field.half{grid-column:auto}
.field i{font-style:normal;font-weight:400;color:var(--faint)}
.acts-rep{display:flex;flex-direction:column;gap:8px}
.acts-rep h3{margin:0;font-size:13.5px}
.act-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px}
.form-err{margin:0;color:var(--red);font-size:14px;font-weight:600}
.sheet footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;display:flex;gap:16px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast .link{color:var(--bg);text-decoration:underline}

@media (max-width:980px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .focus-top{grid-template-columns:1fr}
}
@media (max-width:760px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{min-width:0}
  .rail{top:env(safe-area-inset-top,0px);z-index:20;height:auto;overflow:visible;gap:12px;padding-block:12px 10px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{padding-inline:0}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;padding:7px 12px}
  .rail-actions{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;margin:0;flex-direction:row;align-items:center}
  .rail-timer{width:auto;padding:7px 10px;font-size:13px}
  .save-btn{width:auto;padding:7px 12px;gap:8px}
  .save-btn .t small{display:none}
  .main{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .matrix,.axis{grid-template-columns:1fr}
  .axis{display:none}
  .sheet-wrap{place-items:end center;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .fields{grid-template-columns:1fr}
  .act-row{grid-template-columns:1fr 1fr}
  .act-row .a-title{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.backup p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.backup .acts{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark" aria-hidden="true">D</span><div><b>Daybook</b><small id="syncNote">Opening…</small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="rail-actions">
      <button class="rail-timer" id="railTimer" data-page="focus" hidden><span class="dot"></span><span id="railDigits">25:00</span></button>
      <button class="save-btn" id="saveBtn" data-act="export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="t"><b>Save</b><small id="saveNote">Save to your file</small></span><span class="dot"></span></button>
    </div>
  </aside>
  <main class="main" id="main"><div class="wrap"><p class="loading">Opening your Daybook…</p></div></main>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="scrim" data-act="close-sheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="importFile" accept=".md,.markdown,.txt,text/markdown,text/plain,.json,application/json" hidden>

<script>
(function(){
const $ = (s, r=document) => r.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmt = (s, o={weekday:'short', day:'numeric', month:'short'}) => s ? parse(s).toLocaleDateString(undefined, o) : '';
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear(); return {y, w: Math.ceil(((t - Date.UTC(y,0,1)) / 864e5 + 1) / 7)}; };
const weekKeyOf = s => { const {y,w} = isoWeek(parse(s)); return `${y}-W${pad(w)}`; };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, v); } catch {} };
const mins = m => m >= 60 ? `${Math.floor(m/60)}h ${pad(m%60)}m` : `${m}m`;

const svg = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  today: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  flag: svg('<path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/>'),
  grid: svg('<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>'),
  hour: svg('<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>'),
  book: svg('<path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/>'),
  users: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/>'),
  cal: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  timer: svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  ext: svg('<path d="M7 17L17 7M9 7h8v8"/>'),
  left: svg('<path d="M15 6l-6 6 6 6"/>'),
  right: svg('<path d="M9 6l6 6-6 6"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>')
};

const CATS = ['Report','Referee report','Grant','Conference','Teaching','Admin','Other'];
const QUADS = [
  {id:'do', name:'Do now', sub:'Urgent and important'},
  {id:'plan', name:'Schedule', sub:'Important, not urgent'},
  {id:'delegate', name:'Delegate', sub:'Urgent, not important'},
  {id:'drop', name:'Drop or defer', sub:'Neither urgent nor important'}
];
const RSTAT = [['toread','To read'],['reading','Reading'],['done','Done']];
const NAV = [
  ['today','Today',I.today],['deadlines','Deadlines',I.flag],['priorities','Priorities',I.grid],['waiting','Waiting on',I.hour],
  ['reading','Reading list',I.book],['meetings','Meetings',I.users],['week','Weekly plan',I.cal],['focus','Focus timer',I.timer]
];

/* ---------- State and storage ---------- */
const S = { items:new Map(), mode:'init', loaded:false, col:null, name:'', page:'today',
  weekStart: mondayOf(today()), rfilter:'reading', dcat:'All' };
const startHash = (location.hash || '').slice(1);
S.page = NAV.some(n => n[0] === startHash) ? startHash : (NAV.some(n => n[0] === lsGet('daybook.page')) ? lsGet('daybook.page') : 'today');

const all = () => [...S.items.values()];
const ofKind = k => all().filter(i => i.kind === k);
const openOf = k => ofKind(k).filter(i => !i.done);
const byDue = (a,b) => (a.due || '9999').localeCompare(b.due || '9999');

const pending = new Set(), queued = new Set();
let chain = Promise.resolve();
function saveLocal(){ lsSet('daybook.items.v1', JSON.stringify(all())); }
function persist(id){
  lsSet('daybook.lastChange', String(Date.now()));
  if (S.mode !== 'db') { saveLocal(); renderBrand(); return; }
  pending.add(id);
  if (queued.has(id)) return;
  queued.add(id);
  chain = chain.then(async () => {
    queued.delete(id);
    const cur = S.items.get(id), ref = S.col.doc(id);
    try { if (cur) { const body = {...cur}; delete body.id; await ref.set(body); } else await ref.delete(); }
    catch (e) {
      toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete some old items, then try again.' : "That change didn't save. Check your connection and try again.");
    } finally { if (!queued.has(id)) pending.delete(id); }
  });
}
function put(item){ item.updatedAt = Date.now(); S.items.set(item.id, item); queueRender(); persist(item.id); }
function remove(id){ S.items.delete(id); queueRender(); persist(id); }
function removeMany(list, msg){ list.forEach(i => remove(i.id)); toast(msg, () => list.forEach(i => put({...i}))); }

function useLocal(){
  S.mode = 'local';
  try { (JSON.parse(lsGet('daybook.items.v1') || '[]') || []).forEach(i => S.items.set(i.id, i)); } catch {}
  S.loaded = true; render();
}
function boot(){
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  useLocal();
  let asked = false;
  try { asked = sessionStorage.getItem('daybook.asked') === '1'; sessionStorage.setItem('daybook.asked', '1'); } catch {}
  if (!asked && lsGet('daybook.askOnOpen') !== 'no') openLoadPrompt();
}
function openLoadPrompt(){
  lastFocus = document.activeElement;
  const saved = Number(lsGet('daybook.lastSavedAt') || 0);
  $('#sheet').innerHTML = `<div class="prompt">
    <h2>Load your Daybook file?</h2>
    <p>Choose your Daybook.md file to bring in your latest items.${saved ? ` You last saved on ${new Date(saved).toLocaleString([], {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'})}.` : ''}</p>
    <label class="toggle"><input type="checkbox" id="askToggle" data-act="toggle-ask" ${lsGet('daybook.askOnOpen') === 'no' ? '' : 'checked'}>Ask me each time I open Daybook</label>
    <div class="acts"><button class="btn ghost" data-act="close-sheet">Not now</button><button class="btn primary" data-act="prompt-load">Choose file</button></div>
  </div>`;
  $('#sheetWrap').hidden = false;
}

/* ---------- Backup and restore (Markdown) ---------- */
const MD_SECTIONS = [
  ['deadline','Deadlines',['due','category','notes']],
  ['task','Priorities',['quadrant','due','notes']],
  ['waiting','Waiting on',['who','asked','followup','lastChased','notes']],
  ['reading','Reading list',['status','source','link','why']],
  ['meeting','Meetings',['date','attendees','notes']],
  ['action','Action items',['owner','due','meeting']],
  ['week','Weekly plans',['week','wentWell','slipped','nextWeek']],
  ['focus','Focus sessions',['date']]
];
const CHECKABLE = ['deadline','task','waiting','action'];
const NUM_FIELDS = ['createdAt','updatedAt'];
const SKIP_FIELDS = ['id','kind','title','done','priorities','sessions','meetingId','example'];
const esc1 = v => String(v ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n');
const unesc1 = v => String(v).replace(/\\(\\|n)/g, (m, c) => c === 'n' ? '\n' : '\\');
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function toMarkdown(items){
  const now = new Date();
  const out = [
    '# Daybook', '',
    `Exported ${today()} at ${hhmm(now)}`, '',
    '> Each item starts with "- " under its section. Details go on indented "  - field: value" lines.',
    '> Keep the id line so restoring updates the same item instead of adding a copy.',
    '> New items can be added by hand without an id.', ''
  ];
  for (const [kind, heading, order] of MD_SECTIONS) {
    const its = items.filter(i => i.kind === kind);
    if (!its.length) continue;
    out.push(`## ${heading}`, '');
    for (const it of its) {
      if (kind === 'week') out.push(`- Week ${esc1(it.week || it.id.replace(/^week-/, ''))}`);
      else if (kind === 'focus') out.push(`- ${esc1(it.date)}`);
      else out.push(`- ${CHECKABLE.includes(kind) ? (it.done ? '[x] ' : '[ ] ') : ''}${esc1(it.title)}`);
      const f = (k, v) => { if (v !== undefined && v !== null && v !== '') out.push(`  - ${k}: ${esc1(v)}`); };
      order.forEach(k => f(k, k === 'meeting' ? it.meetingId : it[k]));
      if (kind === 'week') (it.priorities || []).forEach(p => { if (p.text) out.push(`  - priority: [${p.done ? 'x' : ' '}] ${esc1(p.text)}`); });
      if (kind === 'focus') (it.sessions || []).forEach(s => out.push(`  - session: ${hhmm(s.at)} · ${s.minutes} min · ${esc1(s.project || 'General')}${s.ex ? ' · example' : ''}`));
      Object.keys(it).forEach(k => { if (!order.includes(k) && !SKIP_FIELDS.includes(k)) f(k, it[k]); });
      if (it.example) out.push('  - example: yes');
      out.push(`  - id: ${esc1(it.id)}`);
    }
    out.push('');
  }
  return out.join('\n');
}

function fromMarkdown(md){
  const byHeading = {};
  MD_SECTIONS.forEach(([k, h]) => { byHeading[h.toLowerCase()] = k; });
  byHeading['tasks'] = 'task'; byHeading['reading'] = 'reading'; byHeading['actions'] = 'action'; byHeading['focus'] = 'focus'; byHeading['weekly plan'] = 'week';
  const items = []; let kind = null, cur = null;
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, ''); let m;
    if ((m = line.match(/^#{2,3}\s+(.+)$/))) { kind = byHeading[m[1].trim().toLowerCase()] || null; cur = null; continue; }
    if (!kind) continue;
    if ((m = line.match(/^[-*] (?:\[( |x|X)\] )?(.+)$/))) {
      cur = {kind, title:unesc1(m[2].trim())};
      if (CHECKABLE.includes(kind)) cur.done = !!m[1] && m[1].toLowerCase() === 'x';
      if (kind === 'week') { cur.priorities = []; const w = cur.title.match(/(\d{4}-W\d{2})/); if (w) cur.week = w[1]; }
      if (kind === 'focus') { cur.sessions = []; const d = cur.title.match(/(\d{4}-\d{2}-\d{2})/); if (d) cur.date = d[1]; }
      items.push(cur); continue;
    }
    if (cur && (m = line.match(/^\s+[-*] ([A-Za-z]+):\s?(.*)$/))) {
      const k = m[1], v = m[2];
      if (kind === 'week' && k === 'priority') { const p = v.match(/^\[( |x|X)\]\s?(.*)$/); cur.priorities.push(p ? {text:unesc1(p[2]), done:p[1].toLowerCase() === 'x'} : {text:unesc1(v), done:false}); }
      else if (kind === 'focus' && k === 'session') {
        const s = v.match(/^(\d{1,2}):(\d{2})\s*·\s*(\d+)\s*min\s*·\s*(.*?)(\s*·\s*example)?$/);
        if (s) cur.sessions.push({hh:+s[1], mm:+s[2], minutes:+s[3], project:unesc1(s[4]) || 'General', ex:!!s[5]});
      }
      else if (k === 'meeting') cur.meetingId = unesc1(v);
      else if (k === 'example') cur.example = /^(yes|true)$/i.test(v);
      else if (NUM_FIELDS.includes(k)) cur[k] = Number(v) || 0;
      else cur[k] = unesc1(v);
    }
  }
  return items.map(it => {
    if (it.kind === 'week') {
      if (!it.week) return null;
      it.id = 'week-' + it.week; delete it.title;
      while (it.priorities.length < 3) it.priorities.push({text:'', done:false});
      it.priorities = it.priorities.slice(0, 3);
      ['wentWell','slipped','nextWeek'].forEach(k => { it[k] = it[k] || ''; });
    } else if (it.kind === 'focus') {
      if (!it.date) return null;
      it.id = 'focus-' + it.date; delete it.title;
      const base = parse(it.date);
      it.sessions = it.sessions.map(s => { const d = new Date(base); d.setHours(s.hh, s.mm, 0, 0); const o = {project:s.project, minutes:s.minutes, at:d.getTime()}; if (s.ex) o.ex = true; return o; });
    } else {
      if (!it.title) return null;
      it.id = it.id || newId();
      if (it.kind === 'reading' && !it.status) it.status = 'toread';
      if (it.kind === 'task' && !it.quadrant) it.quadrant = 'do';
    }
    it.createdAt = it.createdAt || Date.now();
    return it;
  }).filter(Boolean);
}

function appBridge(){ try { return (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.daybook) || null; } catch { return null; } }
function markSaved(){ lsSet('daybook.lastSavedAt', String(Date.now())); lsSet('daybook.lastBackup', today()); render(); }
const isUnsaved = () => Number(lsGet('daybook.lastChange') || 0) > Number(lsGet('daybook.lastSavedAt') || 0);
function exportData(){
  const data = toMarkdown(all());
  const filename = 'Daybook.md';
  const bridge = appBridge();
  if (bridge) {
    bridge.postMessage({filename, data});
    markSaved(); toast('Choose where to save your file'); return;
  }
  // On iPad and iPhone, the share sheet lets you "Save to Files" and replace the same Daybook.md each time.
  let file = null;
  try { file = new File([data], filename, {type:'text/plain'}); } catch {}
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (touch && file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file]})
      .then(() => { markSaved(); toast('Saved Daybook.md'); })
      .catch(e => { if (e && e.name === 'AbortError') toast('Not saved. Tap Save when you are ready.'); else downloadFile(data, filename); });
    return;
  }
  downloadFile(data, filename);
}
function downloadFile(data, filename){
  const blob = new Blob([data], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  markSaved(); toast('Saved Daybook.md to your downloads');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    let items = [];
    const text = String(r.result || '');
    if (/^\s*[\[{]/.test(text)) {
      try { const j = JSON.parse(text); items = Array.isArray(j) ? j : (j.items || []); } catch {}
    } else items = fromMarkdown(text);
    if (!items.length) { toast("No Daybook items found in that file. Choose a Markdown file saved from Daybook."); return; }
    let added = 0;
    items.forEach(it => {
      if (!it || !it.id || !it.kind) return;
      const cur = S.items.get(it.id);
      if (!cur || (it.updatedAt || 0) > (cur.updatedAt || 0)) { S.items.set(it.id, it); added++; }
    });
    saveLocal();
    if (!isUnsaved() || Number(lsGet('daybook.lastSavedAt') || 0) === 0) lsSet('daybook.lastSavedAt', String(Date.now()));
    render();
    toast(added ? `Loaded ${added} item${added === 1 ? '' : 's'} from ${file.name}` : `You're up to date with ${file.name}`);
  };
  r.readAsText(file);
}
document.addEventListener('change', e => {
  if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
});
function backupCard(){
  const saved = Number(lsGet('daybook.lastSavedAt') || 0);
  const note = saved ? `Last saved ${new Date(saved).toLocaleString([], {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'})}.` : 'Not saved to a file yet.';
  return `<section class="card backup"><div class="card-h"><h2>Your file</h2>${isUnsaved() ? pill('amber', 'Unsaved changes') : pill('green', 'Saved')}</div>
    <p>Your items stay on this iPad and are never sent online. Tap Save before you finish to update your Daybook.md file. In the share sheet, choose Save to Files, pick the same folder each time and tap Replace. ${note}</p>
    <div class="acts"><button class="btn ghost" data-act="export">Save to Daybook.md</button><button class="btn ghost" data-act="import">Load a file</button></div>
    <label class="toggle"><input type="checkbox" id="askToggle2" data-act="toggle-ask" ${lsGet('daybook.askOnOpen') === 'no' ? '' : 'checked'}>Ask to load my file when I open Daybook</label>
    ${appBridge() ? `<div><button class="link" data-act="replace-page">Load an updated daybook.html</button></div>` : ''}</section>`;
}

/* ---------- Rendering ---------- */
let rq = false, dirty = false;
function queueRender(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function isTyping(){ const a = document.activeElement; return a && $('#main').contains(a) && a.matches('textarea, input[type=text], input:not([type])'); }
function render(){
  renderNav(); renderBrand();
  if (isTyping()) { dirty = true; return; }
  dirty = false;
  $('#main').innerHTML = `<div class="wrap">${S.loaded ? PAGES[S.page]() : '<p class="loading">Opening your Daybook…</p>'}</div>`;
  tickUI();
}
document.addEventListener('focusout', () => setTimeout(() => { if (dirty && !isTyping()) render(); }, 0));

function renderBrand(){
  $('#syncNote').textContent = 'Stays on this device';
  const un = isUnsaved(), saved = Number(lsGet('daybook.lastSavedAt') || 0);
  const b = $('#saveBtn'); b.classList.toggle('unsaved', un);
  b.setAttribute('aria-label', un ? 'Save to file. You have unsaved changes.' : 'Save to file');
  $('#saveNote').textContent = un ? 'Unsaved changes' : saved ? `Saved ${new Date(saved).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}` : 'Save to your file';
}
function renderNav(){
  const t = today();
  const overdue = openOf('deadline').filter(d => diff(t, d.due) < 0).length;
  const counts = {
    deadlines: [overdue || openOf('deadline').filter(d => diff(t,d.due) <= 7).length, overdue > 0],
    priorities: [openOf('task').filter(x => x.quadrant === 'do').length],
    waiting: [openOf('waiting').length, openOf('waiting').some(w => w.followup && diff(t, w.followup) <= 0)],
    reading: [ofKind('reading').filter(r => r.status === 'reading').length],
    meetings: [openOf('action').length, openOf('action').some(a => a.due && diff(t,a.due) < 0)]
  };
  $('#nav').innerHTML = NAV.map(([id,label,icon]) => {
    const c = counts[id];
    return `<button data-page="${id}" ${S.page === id ? 'aria-current="page"' : ''}>${icon}<span>${label}</span>${c && c[0] ? `<span class="badge ${c[1] ? 'hot' : ''}">${c[0]}</span>` : ''}</button>`;
  }).join('');
}

const pill = (cls, txt) => `<span class="pill ${cls}">${txt}</span>`;
function duePill(ds, prefix=''){
  if (!ds) return '';
  const d = diff(today(), ds);
  if (d < 0) return pill('red', `${prefix}${-d}d overdue`);
  if (d === 0) return pill('red', prefix ? `${prefix}today` : 'Today');
  if (d === 1) return pill('amber', prefix ? `${prefix}tomorrow` : 'Tomorrow');
  if (d <= 3) return pill('amber', `${prefix}${d} days`);
  if (d <= 14) return pill('blue', `${prefix}${d} days`);
  return pill('', d < 60 ? `${prefix}${Math.round(d/7)} wks` : fmt(ds, {day:'numeric', month:'short'}));
}
const exTag = it => it.example ? '<em class="ex">Example</em>' : '';
function row(it, {meta='', right='', check=true} = {}){
  return `<li class="row ${it.done ? 'is-done' : ''}">
    ${check ? `<label class="check"><input type="checkbox" data-toggle="${h(it.id)}" ${it.done ? 'checked' : ''} aria-label="Mark ${h(it.title)} done"><span></span></label>` : ''}
    <button class="row-main" data-edit="${h(it.id)}"><span class="row-title">${h(it.title)}${exTag(it)}</span>${meta ? `<span class="row-meta">${meta}</span>` : ''}</button>
    ${right}
    <button class="icon-btn" data-del="${h(it.id)}" aria-label="Delete ${h(it.title)}">${I.trash}</button>
  </li>`;
}
const list = (items, fn, empty) => items.length ? `<ul class="list">${items.map(fn).join('')}</ul>` : `<p class="empty">${empty}</p>`;
const head = (title, sub, right='', eyebrow='') => `<header class="ph"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${right}</header>`;
const addBtn = (kind, label, preset) => `<button class="btn primary" data-add="${kind}"${preset ? ` data-preset="${h(JSON.stringify(preset))}"` : ''}>${I.plus}<span>${label}</span></button>`;
const card = (title, body, right='') => `<section class="card"><div class="card-h"><h2>${title}</h2>${right}</div>${body}</section>`;

const deadlineRow = d => row(d, {meta: `${h(d.category || 'Other')} · ${fmt(d.due)}`, right: d.done ? '' : duePill(d.due)});
const taskRow = t => row(t, {meta: t.due ? `Due ${fmt(t.due)}` : '', right: t.done ? '' : duePill(t.due)});
const actionRow = a => {
  const m = a.meetingId && S.items.get(a.meetingId);
  return row(a, {meta: [a.owner ? `<span class="owner">${h(a.owner)}</span>` : '', m ? h(m.title) : '', a.due ? fmt(a.due) : ''].filter(Boolean).join(' · '), right: a.done ? '' : duePill(a.due)});
};
const waitDays = w => w.asked ? Math.max(0, diff(w.asked, today())) : 0;
const waitingRow = w => row(w, {
  meta: `${h(w.who)} · ${waitDays(w)} day${waitDays(w) === 1 ? '' : 's'} waiting${w.lastChased ? ` · chased ${fmt(w.lastChased, {day:'numeric', month:'short'})}` : ''}${!w.done && w.followup ? ` ${duePill(w.followup, 'Chase ')}` : ''}`,
  right: w.done ? '' : `<button class="btn ghost" style="padding:5px 10px;font-size:13px" data-chase="${h(w.id)}">Chased</button>`
});

function weekDoc(key){
  return S.items.get('week-' + key) || {id:'week-' + key, kind:'week', week:key, priorities:[{text:'',done:false},{text:'',done:false},{text:'',done:false}], wentWell:'', slipped:'', nextWeek:''};
}
function focusByDay(from, to){
  const out = {};
  ofKind('focus').forEach(f => { if (f.date >= from && f.date <= to) (f.sessions || []).forEach(s => { out[f.date] = (out[f.date] || 0) + (s.minutes || 0); }); });
  return out;
}
function focusByProject(from, to){
  const out = {};
  ofKind('focus').forEach(f => { if (f.date >= from && f.date <= to) (f.sessions || []).forEach(s => { const p = s.project || 'General'; out[p] = (out[p] || 0) + (s.minutes || 0); }); });
  return Object.entries(out).sort((a,b) => b[1] - a[1]);
}
const sumObj = o => Object.values(o).reduce((a,b) => a + b, 0);

/* ---------- Pages ---------- */
const PAGES = {
today(){
  const t = today(), D = new Date(), {w} = isoWeek(D), q = Math.floor(D.getMonth()/3) + 1, hr = D.getHours();
  const greet = (hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening') + (S.name ? `, ${h(S.name)}` : '');
  const dls = openOf('deadline').sort(byDue);
  const overdue = [...dls, ...openOf('task'), ...openOf('action')].filter(i => i.due && diff(t, i.due) < 0);
  const due7 = dls.filter(d => { const n = diff(t, d.due); return n >= 0 && n <= 7; });
  const waiting = openOf('waiting').sort((a,b) => (a.asked || '').localeCompare(b.asked || ''));
  const actions = openOf('action').sort(byDue);
  const key = weekKeyOf(t), wk = weekDoc(key);
  const fToday = sumObj(focusByDay(t, t));
  const reading = ofKind('reading').filter(r => r.status === 'reading');
  const doNow = openOf('task').filter(x => x.quadrant === 'do').sort(byDue);
  const hasEx = all().some(i => i.example || (i.sessions || []).some(s => s.ex));

  const parts = [];
  if (overdue.length) parts.push(`${overdue.length} overdue`);
  parts.push(`${due7.length} deadline${due7.length === 1 ? '' : 's'} in the next 7 days`);
  if (waiting.length) parts.push(`${waiting.length} thing${waiting.length === 1 ? '' : 's'} you're waiting on`);

  let out = head(fmt(t, {weekday:'long', day:'numeric', month:'long'}), `${greet}. ${S.items.size ? parts.join(', ') + '.' : ''}`, '', `Week ${w} · Q${q} ${D.getFullYear()}`);

  if (!S.items.size) {
    return out + `<section class="welcome"><h2>Set up your Daybook</h2>
      <p>Add your first deadline, or load a set of example items to see how each page works. Examples are labelled and you can clear them in one tap.</p>
      <div class="acts">${addBtn('deadline','Add a deadline')}<button class="btn ghost" data-act="examples">Load examples</button><button class="btn ghost" data-act="import">Load a file</button></div></section>`;
  }
  if (hasEx) out += `<div class="banner"><span>Some items here are examples.</span><button class="btn ghost" data-act="clear-examples">Clear examples</button></div>`;

  out += `<div class="tiles">
    <button class="tile ${overdue.length ? 'alert' : ''}" data-page="deadlines"><b>${overdue.length}</b><span>Overdue</span></button>
    <button class="tile" data-page="deadlines"><b>${due7.length}</b><span>Due in 7 days</span></button>
    <button class="tile" data-page="waiting"><b>${waiting.length}</b><span>Waiting on</span></button>
    <button class="tile" data-page="meetings"><b>${actions.length}</b><span>Open actions</span></button>
  </div>`;

  const prios = wk.priorities.filter(p => p.text);
  const prioHtml = prios.length ? `<ul class="list">${wk.priorities.map((p,i) => p.text ? `<li class="row ${p.done ? 'is-done' : ''}"><label class="check"><input type="checkbox" data-wkcheck="${i}" data-wk="${key}" ${p.done ? 'checked' : ''} aria-label="Mark priority done"><span></span></label><span class="row-main"><span class="row-title">${h(p.text)}</span></span></li>` : '').join('')}</ul>`
    : `<p class="empty">No priorities set for this week.</p><div><button class="btn ghost" data-page="week">Set three priorities</button></div>`;

  out += `<div class="grid2">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      ${card('Coming up', list(dls.slice(0,6), deadlineRow, 'Nothing due. Add a deadline to see it here.'), `<button class="link" data-page="deadlines">All deadlines</button>`)}
      ${card('Do now', list(doNow.slice(0,5), taskRow, 'Nothing urgent and important. Nice.'), `<button class="link" data-page="priorities">Priorities</button>`)}
      ${card('Action items', list(actions.slice(0,5), actionRow, 'No open action items.'), `<button class="link" data-page="meetings">Meetings</button>`)}
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      ${card('This week', prioHtml, `<button class="link" data-page="week">Weekly plan</button>`)}
      ${card('Waiting on', list(waiting.slice(0,4), waitingRow, 'Not waiting on anyone.'), `<button class="link" data-page="waiting">All</button>`)}
      ${card('Focus today', `<div class="bigstat"><div><b>${mins(fToday)}</b><span>focused today</span></div><div><b>${mins(sumObj(focusByDay(mondayOf(t), t)))}</b><span>this week</span></div></div><div><button class="btn ghost" data-page="focus">${I.timer}<span>Start a session</span></button></div>`)}
      ${reading.length ? card('Reading now', `<ul class="list">${reading.slice(0,3).map(r => `<li class="row"><button class="row-main" data-edit="${h(r.id)}"><span class="row-title">${h(r.title)}${exTag(r)}</span><span class="row-meta">${h(r.source || '')}</span></button></li>`).join('')}</ul>`, `<button class="link" data-page="reading">Reading list</button>`) : ''}
    </div>
  </div>`;
  return out + backupCard();
},

deadlines(){
  const t = today();
  const items = ofKind('deadline');
  const cats = ['All', ...CATS.filter(c => items.some(i => (i.category || 'Other') === c))];
  if (!cats.includes(S.dcat)) S.dcat = 'All';
  const f = i => S.dcat === 'All' || (i.category || 'Other') === S.dcat;
  const open = items.filter(i => !i.done && f(i)).sort(byDue);
  const done = items.filter(i => i.done && f(i)).sort((a,b) => (b.due || '').localeCompare(a.due || ''));
  const overdue = open.filter(i => diff(t, i.due) < 0), soon = open.filter(i => { const n = diff(t,i.due); return n >= 0 && n <= 14; }), later = open.filter(i => diff(t, i.due) > 14);
  let out = head('Deadlines', 'Reports, referee reports, grants and submissions, sorted by how soon they land.', addBtn('deadline','Add deadline'));
  if (cats.length > 2) out += `<div class="chips">${cats.map(c => `<button class="chip" data-dcat="${h(c)}" aria-pressed="${S.dcat === c}">${h(c)}</button>`).join('')}</div>`;
  if (!open.length && !done.length) return out + card('Nothing yet', `<p class="empty">Add your first deadline and it will count down here.</p>`);
  if (overdue.length) out += card('Overdue', list(overdue, deadlineRow, ''), `<span class="count">${overdue.length}</span>`);
  out += card('Next two weeks', list(soon, deadlineRow, 'Nothing due in the next two weeks.'), `<span class="count">${soon.length}</span>`);
  if (later.length) out += card('Later', list(later, deadlineRow, ''), `<span class="count">${later.length}</span>`);
  if (done.length) out += `<section class="card"><details class="done-list"><summary>Completed (${done.length})</summary>${list(done, deadlineRow, '')}</details></section>`;
  return out;
},

priorities(){
  const tasks = ofKind('task');
  const anyDone = tasks.some(t => t.done);
  let out = head('Priorities', 'Sort tasks by urgency and importance. Tap a task to move it to another box.',
    `<div style="display:flex;gap:8px;flex-wrap:wrap">${anyDone ? `<button class="btn ghost" data-act="clear-done">Clear done</button>` : ''}${addBtn('task','Add task')}</div>`);
  out += `<div class="axis"><span>Urgent</span><span>Not urgent</span></div><div class="matrix">`;
  ['do','plan','delegate','drop'].forEach(qid => {
    const q = QUADS.find(x => x.id === qid);
    const its = tasks.filter(t => (t.quadrant || 'do') === qid).sort((a,b) => (a.done - b.done) || byDue(a,b));

waiting(){

  let out = head('Waiting on', 'Data, sign-offs and replies you have asked others for. Tick an item when it arrives.', addBtn('waiting','Add item'));

  const rest = open.filter(i => !chaseNow.includes(i));

let sheetCtx = null, lastFocus = null;
function openSheet(kind, id, preset={}){
  const sc = SCHEMAS[kind]; if (!sc) return;
  const it = id ? S.items.get(id) : null;

    else if (f.t === 'textarea') ctl = `<textarea id="${idA}" placeholder="${h(f.ph || '')}">${h(v)}</textarea>`;
    else ctl = `<input id="${idA}" type="${f.t || 'text'}" value="${h(v)}" placeholder="${h(f.ph || '')}" ${f.t === 'url' ? 'inputmode="url"' : ''}>`;
    return `<label class="field ${f.half ? 'half' : ''}" for="${idA}"><span>${f.l}${f.req || f.t === 'select' ? '' : ' <i>optional</i>'}</span>${ctl}</label>`;
  };
  const actRow = n => `<div class="act-row"><input type="text" class="a-title" id="a-title-${n}" placeholder="Action item" aria-label="Action item"><input type="text" class="a-owner" id="a-owner-${n}" value="Me" aria-label="Owner"><input type="date" class="a-due" id="a-due-${n}" aria-label="Due date"></div>`;
  $('#sheet').innerHTML = `<form id="sheetForm" novalidate>

    <div class="fields">${sc.fields.map(field).join('')}</div>
    ${sc.actions && !it ? `<div class="acts-rep" id="actsRep"><h3>Action items <i style="font-weight:400;color:var(--faint);font-style:normal">optional</i></h3>${actRow(0)}${actRow(1)}<div><button type="button" class="link" data-act="add-act-row">+ Another action item</button></div></div>` : ''}

function closeSheet(){ $('#sheetWrap').hidden = true; sheetCtx = null; if (lastFocus && lastFocus.focus) try { lastFocus.focus({preventScroll:true}); } catch {} }
document.addEventListener('submit', e => {
  if (e.target.id !== 'sheetForm') return;
  e.preventDefault();
  const {kind, id, preset} = sheetCtx, sc = SCHEMAS[kind];
  const vals = {};
  for (const f of sc.fields) vals[f.k] = ($('#f-' + f.k).value || '').trim();
  const missing = sc.fields.filter(f => f.req && !vals[f.k]);
  if (missing.length) { const el = $('#formErr'); el.textContent = `Add ${missing.map(f => f.l.toLowerCase()).join(' and ')} to save.`; el.hidden = false; $('#f-' + missing[0].k).focus(); return; }
  if (vals.link && !/^https?:\/\//i.test(vals.link)) vals.link = 'https://' + vals.link;
  const base = id ? {...S.items.get(id)} : {id:newId(), kind, done:false, createdAt:Date.now(), ...preset};

  toast(id ? 'Saved' : `Added ${sc.label}`);
});

/* ---------- Focus timer ---------- */
const T = Object.assign({dur:25, project:'', running:false, endsAt:0, remaining:25*60e3}, (() => { try { return JSON.parse(lsGet('daybook.timer') || '{}'); } catch { return {}; } })());
const saveT = () => lsSet('daybook.timer', JSON.stringify(T));
const tLeft = () => T.running ? Math.max(0, T.endsAt - Date.now()) : T.remaining;
let actx = null, lock = null;
function chime(){
  try {
    if (!actx) return;
    [0, .22, .44].forEach((dt, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = [660, 880, 990][i]; o.type = 'sine';
      g.gain.setValueAtTime(.0001, actx.currentTime + dt); g.gain.exponentialRampToValueAtTime(.2, actx.currentTime + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dt + .35);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + dt); o.stop(actx.currentTime + dt + .4);
    });
  } catch {}
}
function logFocus(minutes){
  const t = today(), id = 'focus-' + t, cur = S.items.get(id) || {id, kind:'focus', date:t, sessions:[]};
  put({...cur, sessions:[...(cur.sessions || []), {project:T.project || 'General', minutes, at:Date.now()}]});
}
function tReset(){ T.running = false; T.remaining = T.dur * 60e3; saveT(); try { lock && lock.release(); } catch {} lock = null; }
function tickUI(){
  const left = tLeft(), mm = Math.floor(left / 60e3), ss = Math.floor((left % 60e3) / 1e3), txt = `${pad(mm)}:${pad(ss)}`;
  const d = $('#tDigits'); if (d) d.textContent = txt;
  const r = $('#tRing'); if (r) r.style.setProperty('--p', String(1 - left / (T.dur * 60e3)));
  const l = $('#tLabel'); if (l) l.textContent = T.running ? (T.project || 'Focusing') : (left < T.dur * 60e3 ? 'Paused' : `${T.dur} minute session`);
  const active = T.running || left < T.dur * 60e3;
  const rt = $('#railTimer'); rt.hidden = !active || S.page === 'focus'; rt.classList.toggle('paused', !T.running); $('#railDigits').textContent = txt;
}
setInterval(() => {
  if (T.running && tLeft() <= 0) {
    logFocus(T.dur); chime(); toast(`Session logged: ${T.dur} min on ${T.project || 'General'}`); tReset(); render(); return;
  }
  tickUI();
}, 500);

/* ---------- Toast ---------- */
let toastT;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = `<span>${h(msg)}</span>${undo ? '<button class="link" id="undoBtn">Undo</button>' : ''}`;
  el.hidden = false;
  if (undo) $('#undoBtn').onclick = () => { undo(); el.hidden = true; };
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 3000);
}

/* ---------- Events ---------- */
function go(page){
  S.page = page; lsSet('daybook.page', page);
  try { history.replaceState(null, '', '#' + page); } catch {}
  render(); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-page],[data-add],[data-edit],[data-del],[data-chase],[data-rfilter],[data-dcat],[data-act]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.page) return go(ds.page);
  if (ds.add) { let p = {}; try { p = JSON.parse(ds.preset || '{}'); } catch {} return openSheet(ds.add, null, p); }
  if (ds.edit) { const it = S.items.get(ds.edit); if (it) openSheet(it.kind, it.id); return; }
  if (ds.del) {
    const it = S.items.get(ds.del); if (!it) return;
    const extra = it.kind === 'meeting' ? ofKind('action').filter(a => a.meetingId === it.id) : [];
    return removeMany([it, ...extra], `Deleted “${it.title}”`);
  }
  if (ds.chase) { const it = S.items.get(ds.chase); if (it) { put({...it, lastChased:today(), followup:addDays(today(), 3)}); toast(`Next chase set for ${fmt(addDays(today(), 3))}`); } return; }
  if (ds.rfilter) { S.rfilter = ds.rfilter; return render(); }
  if (ds.dcat) { S.dcat = ds.dcat; return render(); }
  switch (ds.act) {
    case 'close-sheet': return closeSheet();
    case 'sheet-delete': { const it = S.items.get(sheetCtx.id); closeSheet(); if (it) { const extra = it.kind === 'meeting' ? ofKind('action').filter(a => a.meetingId === it.id) : []; removeMany([it, ...extra], `Deleted “${it.title}”`); } return; }
    case 'add-act-row': { const rep = $('#actsRep'), n = rep.querySelectorAll('.act-row').length; rep.querySelector('.act-row:last-of-type').insertAdjacentHTML('afterend', `<div class="act-row"><input type="text" class="a-title" id="a-title-${n}" placeholder="Action item" aria-label="Action item"><input type="text" class="a-owner" id="a-owner-${n}" value="Me" aria-label="Owner"><input type="date" class="a-due" id="a-due-${n}" aria-label="Due date"></div>`); $('#a-title-' + n).focus(); return; }
    case 'export': return exportData();
    case 'import': return $('#importFile').click();
    case 'prompt-load': closeSheet(); return $('#importFile').click();
    case 'toggle-ask': lsSet('daybook.askOnOpen', el.checked ? 'yes' : 'no'); return;
    case 'replace-page': { const b = appBridge(); if (b) b.postMessage({action:'replacePage'}); return; }
    case 'examples': return loadExamples();
    case 'clear-examples': return clearExamples();
    case 'clear-done': return removeMany(ofKind('task').filter(t => t.done), 'Cleared completed tasks');
    case 'week-prev': S.weekStart = addDays(S.weekStart, -7); return render();
    case 'week-next': S.weekStart = addDays(S.weekStart, 7); return render();
    case 'week-now': S.weekStart = mondayOf(today()); return render();
    case 't-dur': if (!T.running) { T.dur = Number(ds.v); T.remaining = T.dur * 60e3; saveT(); render(); } return;
    case 't-start':
      try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch {}
      try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { lock = l; }).catch(() => {}); } catch {}
      T.running = true; T.endsAt = Date.now() + T.remaining; saveT(); return render();
    case 't-pause': T.remaining = tLeft(); T.running = false; saveT(); return render();
    case 't-reset': tReset(); return render();
    case 't-finish': { const m = Math.round((T.dur * 60e3 - tLeft()) / 60e3); if (m >= 1) { logFocus(m); toast(`Session logged: ${m} min on ${T.project || 'General'}`); } else toast('Sessions under a minute are not logged'); tReset(); return render(); }
  }
});
document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.toggle) { const it = S.items.get(ds.toggle); if (it) put({...it, done:el.checked, doneAt:el.checked ? today() : ''}); return; }
  if (ds.status) { const it = S.items.get(ds.status); if (it) { put({...it, status:el.value}); toast(`Moved to ${RSTAT.find(r => r[0] === el.value)[1]}`); } return; }
  if (ds.wkcheck != null) { const i = Number(ds.wkcheck); return saveWeek(ds.wk, w => { w.priorities[i].done = el.checked; }, true); }
  if (ds.wktext != null || ds.wkfield) { clearTimeout(wkTimers[el.id]); return flushWeekField(el); }
  if (el.id === 'tProject') { T.project = el.value.trim(); saveT(); }
});
function flushWeekField(el){
  const ds = el.dataset;
  if (ds.wktext != null) saveWeek(ds.wk, w => { w.priorities[Number(ds.wktext)].text = el.value; }, false);
  else saveWeek(ds.wk, w => { w[ds.wkfield] = el.value; }, false);
}
document.addEventListener('input', e => {
  const el = e.target, ds = el.dataset;
  if (ds.wktext != null || ds.wkfield) { clearTimeout(wkTimers[el.id]); wkTimers[el.id] = setTimeout(() => flushWeekField(el), 1200); }
  if (el.id === 'tProject') { T.project = el.value.trim(); saveT(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });

boot();
})();
</script>
