<style>
/* Layout: navy rail with trident brand and quote card; workspace under a sunset hero scene, glass cards with tinted icon chips */
:root{
  --bg:#020617; --surface:#0F172A;
  --card:linear-gradient(180deg,rgba(18,29,58,.86),rgba(9,16,36,.86));
  --raised:rgba(15,23,42,.72); --sunk:rgba(148,163,184,.07);
  --line:rgba(120,146,214,.16); --line-2:rgba(120,146,214,.26);
  --ink:#F1F5F9; --muted:#A3B1C8; --faint:#6B7A93;
  --primary:#3B82F6; --primary-2:#2563EB; --secondary:#8B5CF6; --success:#10B981; --warning:#F59E0B; --gold:#F5B731;
  --accent:#60A5FA; --accent-ink:#FFFFFF; --accent-soft:rgba(59,130,246,.16);
  --red:#F87171; --red-soft:rgba(248,113,113,.14); --amber:#FBBF24; --amber-soft:rgba(245,158,11,.16);
  --green:#34D399; --green-soft:rgba(16,185,129,.16); --violet:#A78BFA;
  --rail:#050D24; --rail-ink:#B6C2D9; --rail-hi:#FFFFFF;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(0,0,0,.7);
  --f-display:"Inter",-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* Rail */
.rail{background:linear-gradient(180deg,#071232 0%,var(--rail) 100%);border-right:1px solid var(--line);color:var(--rail-ink);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:26px;padding-block:26px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;align-items:center;gap:12px;padding-inline:10px}
.brand .logo{width:44px;height:48px;flex:none}
.brand b{display:block;font-weight:600;font-size:22px;color:var(--rail-hi);letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-size:12px;color:var(--rail-ink);letter-spacing:.01em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border:0;border-radius:14px;background:none;color:var(--rail-ink);font-weight:500;font-size:15.5px;text-align:left;white-space:nowrap}
.nav button svg{width:22px;height:22px}
.nav button:hover{color:var(--rail-hi);background:rgba(59,130,246,.08)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,#1E3A8A,#2563EB);color:var(--rail-hi);box-shadow:0 8px 24px -10px rgba(37,99,235,.7)}
.nav .badge{margin-left:auto;font-size:12px;font-weight:600;min-width:24px;text-align:center;padding:2px 7px;border-radius:8px;background:rgba(148,163,184,.14);color:var(--rail-hi);font-variant-numeric:tabular-nums}
.nav .badge.hot{background:rgba(248,113,113,.22);color:#FECACA}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.quote{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line-2);min-height:230px;display:flex;align-items:flex-end}
.quote .scene{position:absolute;inset:0}
.quote .scene svg{width:100%;height:100%}
.quote::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(5,13,36,.88) 0%,rgba(5,13,36,.55) 45%,rgba(5,13,36,0) 75%),linear-gradient(180deg,rgba(5,13,36,.2),rgba(5,13,36,0) 50%,rgba(5,13,36,.5))}
.quote .q-in{position:relative;z-index:1;padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.quote .q-in .qlogo{width:26px;height:28px}
.quote p{margin:0;color:#fff;font-size:16.5px;line-height:1.35;font-weight:500;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.rail-timer{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(59,130,246,.1);color:var(--rail-hi);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;width:100%}
.rail-timer svg{color:var(--gold);width:18px;height:18px}
.rail-timer.paused svg{color:var(--faint)}

/* Main + hero */
.main{position:relative;min-width:0;padding-block:30px 72px;padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px));isolation:isolate}
.hero{position:absolute;inset:0 0 auto 0;height:380px;z-index:-1;overflow:hidden;pointer-events:none}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(2,6,23,.82) 32%,rgba(2,6,23,.25) 70%,rgba(2,6,23,.1) 100%),linear-gradient(0deg,var(--bg) 2%,rgba(2,6,23,0) 65%)}
.topbar{position:absolute;top:30px;right:max(40px,env(safe-area-inset-right,0px));z-index:3;display:flex;align-items:center;gap:12px}
.round-btn{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);background:rgba(15,23,42,.7);display:grid;place-items:center;color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.round-btn .bdot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #0F172A}
.avatar{width:46px;height:46px;border-radius:50%;border:1px solid rgba(96,165,250,.5);background:linear-gradient(135deg,#1D4ED8,#1E3A8A);color:#fff;font-weight:600;font-size:15px;display:grid;place-items:center}
.save-btn{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:rgba(15,23,42,.7);color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:600}
.save-btn svg{width:18px;height:18px}
.save-btn .t{display:flex;flex-direction:column;line-height:1.15}
.save-btn .t small{font-size:11.5px;font-weight:500;color:var(--muted)}
.save-btn .dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--warning)}
.save-btn.unsaved{border-color:rgba(245,158,11,.55)}
.save-btn.unsaved .t small{color:var(--amber)}
.save-btn.unsaved .dot{display:block}

.wrap{max-width:1140px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:4px;margin-bottom:6px}
.ph>div:first-child{padding-right:250px;min-width:0}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#93C5FD;margin:0 0 10px;font-weight:500}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.2vw,44px);letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:balance}
.sub{margin:12px 0 0;color:#CBD5E1;max-width:62ch;font-size:16px}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0}
.loading{color:var(--muted);padding:40px 0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:600;font-size:14.5px;border:1px solid transparent;background:var(--sunk);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 10px 24px -12px rgba(37,99,235,.9),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:rgba(15,23,42,.5);border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover{background:rgba(59,130,246,.1)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--muted);flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn:hover{background:rgba(148,163,184,.1);color:var(--ink)}
.link{border:0;background:none;color:var(--accent);font-weight:500;font-size:14px;padding:4px 0;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.card-h .link::after{content:"→";font-size:15px}
.link:hover{color:#93C5FD}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:rgba(15,23,42,.6);border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;border-color:transparent}
.chip .n{margin-left:6px;opacity:.8;font-variant-numeric:tabular-nums}

/* Cards */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card::after{content:"";position:absolute;right:-60px;bottom:-80px;width:280px;height:170px;border-radius:50%;background:radial-gradient(closest-side,rgba(59,130,246,.10),transparent);pointer-events:none}
.card>*{position:relative;z-index:1}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ch-left{display:flex;align-items:center;gap:14px;min-width:0}
.ch-left p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ichip{--tc:#3B82F6;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc) 18%,transparent);color:color-mix(in srgb,var(--tc) 70%,#fff);border:1px solid color-mix(in srgb,var(--tc) 30%,transparent)}
.ichip svg{width:21px;height:21px}
.card-h .count{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:13px 14px 13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--raised);min-width:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;text-align:left}
.row-title{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.row-meta{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.row.is-done{opacity:.65}
.row.is-done .row-title{text-decoration:line-through;color:var(--faint);font-weight:500}
.ex{white-space:nowrap;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px;font-weight:500}
.empty{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:15px;margin:2px 0;padding-left:2px}
.empty svg{color:var(--muted);width:22px;height:22px}
.check{position:relative;flex:none;width:26px;height:26px}
.check input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.check span{position:absolute;inset:0;border-radius:8px;border:1.6px solid #7C8AA5;display:grid;place-items:center;transition:background .15s,border-color .15s}
.check input:checked+span{background:var(--success);border-color:var(--success)}
.check input:checked+span::after{content:"";width:10px;height:5px;border:2.2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pill{flex:none;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums;background:rgba(148,163,184,.12);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--accent-soft);color:#93C5FD}
.pill.green{background:var(--green-soft);color:var(--green)}
.row-meta .pill{font-size:12px;padding:2px 9px;margin-left:4px}
details.done-list summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14.5px;padding:2px 0}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{--tc:#3B82F6;position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink);
  background:linear-gradient(140deg,color-mix(in srgb,var(--tc) 26%,#0B1430) 0%,color-mix(in srgb,var(--tc) 8%,#0B1430) 100%);
  border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);box-shadow:0 18px 40px -26px color-mix(in srgb,var(--tc) 80%,transparent)}
.tile::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:120px;border-radius:50%;border-top:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:radial-gradient(closest-side,color-mix(in srgb,var(--tc) 22%,transparent),transparent)}
.tile:hover{filter:brightness(1.08)}
.tile .ichip{width:44px;height:44px;border-radius:50%;margin-bottom:10px}
.tile b{font-size:36px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span.l{font-size:15px;color:#DCE4F2;font-weight:500}
.tile.alert b{color:#FCA5A5}
.t-blue{--tc:#3B82F6} .t-violet{--tc:#8B5CF6} .t-green{--tc:#10B981} .t-amber{--tc:#F59E0B} .t-red{--tc:#F87171} .t-slate{--tc:#94A3B8}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-radius:14px;border:1px dashed var(--line-2);color:var(--muted);font-size:14.5px;background:rgba(15,23,42,.5)}
.welcome{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.welcome h2{font-size:26px}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.welcome .acts{display:flex;gap:10px;flex-wrap:wrap}

/* Priority matrix */
.axis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding-inline:6px;font-weight:500}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.quad{border-color:color-mix(in srgb,var(--tc) 35%,transparent)}
.quad::after{background:radial-gradient(closest-side,color-mix(in srgb,var(--tc) 14%,transparent),transparent)}

/* Reading cards */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.rcard{gap:10px}
.rcard .src{font-size:13.5px;color:var(--muted);margin:0}
.rcard .why{margin:0;font-size:14.5px;color:#D5DEEC;overflow-wrap:anywhere}
.rcard .foot{display:flex;align-items:center;gap:10px;margin-top:auto;flex-wrap:wrap;padding-top:6px}
.rcard .title-btn{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.ext{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:500;font-size:14px;text-decoration:none}
.ext svg{width:16px;height:16px}
select.mini{border:1px solid var(--line-2);background:rgba(2,6,23,.6);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}

/* Meetings */
.mtg .when{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#93C5FD;margin:0 0 2px;font-weight:500}
.mtg .who{font-size:14px;color:var(--muted);margin:0}
.mtg .notes{margin:0;white-space:pre-wrap;font-size:14.5px;color:#D5DEEC;overflow-wrap:anywhere}
.owner{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(139,92,246,.18);color:#C4B5FD}

/* Week */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .lbl{font-size:14px;font-weight:600;padding:0 6px;font-variant-numeric:tabular-nums}
.prio{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--raised)}
.prios{display:flex;flex-direction:column;gap:10px}
.prio .num{font-weight:700;color:#93C5FD;width:18px;font-variant-numeric:tabular-nums}
.prio input[type=text]{flex:1;min-width:0;border:0;background:none;padding:6px 0;font-weight:600;font-size:16px;border-radius:0;border-bottom:1px dashed transparent}
.prio input[type=text]:focus{outline:none;border-bottom-color:var(--accent)}
.prio.is-done input[type=text]{text-decoration:line-through;color:var(--faint)}
.review label{display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14.5px}
textarea,input[type=text],input[type=date],input[type=url],select{border:1px solid var(--line-2);background:rgba(2,6,23,.55);border-radius:12px;padding:10px 12px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}

/* Focus */
.focus-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:32px;align-items:center}
.ring{width:100%;max-width:280px;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,#60A5FA,#3B82F6 calc(var(--p,0) * 1turn),rgba(148,163,184,.1) 0);display:grid;place-items:center;margin-inline:auto;box-shadow:0 0 60px -20px rgba(59,130,246,.6)}
.ring-in{width:calc(100% - 22px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 30%,#13204A,#0A1230);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.digits{font-weight:600;font-size:clamp(42px,8vw,58px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.ring-in small{color:var(--muted);font-size:13.5px;max-width:80%;text-align:center;overflow-wrap:anywhere}
.fctl{display:flex;flex-direction:column;gap:16px}
.fctl .btns{display:flex;gap:10px;flex-wrap:wrap}
.fctl label{display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14.5px}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14.5px}
.bars .b span{overflow-wrap:anywhere}
.bars .b em{font-style:normal;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars .track{grid-column:1/-1;height:8px;border-radius:6px;background:rgba(148,163,184,.1);overflow:hidden}
.bars .track i{display:block;height:100%;background:linear-gradient(90deg,#8B5CF6,#3B82F6);border-radius:6px}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:160px}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cols .c i{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#60A5FA,#2563EB);min-height:3px}
.cols .c.zero i{background:rgba(148,163,184,.14)}
.cols .c.today i{background:linear-gradient(180deg,#34D399,#059669)}
.cols .c em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cols .c span{font-size:12px;color:var(--faint);font-weight:600}
.bigstat{display:flex;gap:28px;flex-wrap:wrap;align-items:stretch}
.bigstat div{display:flex;flex-direction:column;gap:2px}
.bigstat div+div{border-left:1px solid var(--line-2);padding-left:28px}
.bigstat div b{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigstat div span{font-size:14px;color:var(--muted)}

/* Month calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cal-head .mnav{display:flex;align-items:center;gap:4px}
.cal{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font-size:11.5px;font-weight:600;color:var(--faint);text-align:center;text-transform:uppercase;letter-spacing:.08em;padding-bottom:2px}
.cal .wk{font-size:11px;color:var(--faint);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cday{min-height:52px;border:1.5px solid transparent;border-radius:12px;background:rgba(148,163,184,.06);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:7px 2px 8px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.cday:hover{border-color:var(--line-2)}
.cday.out{background:none;color:var(--faint)}
.cday.dl{background:rgba(59,130,246,.2);color:#BFDBFE;font-weight:600}
.cday.late{color:var(--red)}
.cday.today .dn{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;border-radius:99px;padding:0 7px}
.cday.sel{border-color:#60A5FA}
.dots{display:flex;gap:3px;min-height:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dots em{font-style:normal;font-size:9.5px;line-height:1;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span,.tl{display:inline-flex;align-items:center;gap:6px}
.legend i,.tl i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tl{font-weight:600;color:var(--ink)}
.agenda{display:flex;flex-direction:column;gap:12px;min-width:0}
.agenda h3{margin:0;font-size:17px;font-weight:600}

/* File card, toggles, prompt */
.backup p{margin:0;color:var(--muted);font-size:14.5px;max-width:72ch}
.backup .acts{display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--primary)}
.prompt{display:flex;flex-direction:column;gap:16px;padding:24px}
.prompt p{margin:0;color:var(--muted)}
.prompt .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(2,6,23,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:relative;width:min(580px,100%);max-height:calc(100vh - 40px);overflow:auto;background:linear-gradient(180deg,#111C3A,#0B1430);border-radius:22px;border:1px solid var(--line-2);box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.sheet form{display:flex;flex-direction:column;gap:18px;padding:24px}
.sheet header{display:flex;align-items:center;justify-content:space-between}
.sheet h2{font-size:22px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:7px;font-weight:600;font-size:14px;grid-column:1/-1}
.field.half{grid-column:auto}
.field i{font-style:normal;font-weight:400;color:var(--faint)}
.acts-rep{display:flex;flex-direction:column;gap:8px}
.acts-rep h3{margin:0;font-size:14px}
.act-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px}
.form-err{margin:0;color:var(--red);font-size:14px;font-weight:600}
.sheet footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;background:#1E293B;border:1px solid var(--line-2);color:var(--ink);padding:12px 18px;border-radius:14px;display:flex;gap:16px;align-items:center;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 18px 40px -14px rgba(0,0,0,.7)}
.toast .link{color:#93C5FD;text-decoration:underline}

@media (max-width:1100px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .focus-top{grid-template-columns:1fr}
  .cal-wrap{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#071232}
  .rail{top:env(safe-area-inset-top,0px);z-index:20;height:auto;overflow:visible;gap:12px;padding-block:12px 10px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding-inline:0}
  .brand .logo{width:34px;height:38px}
  .brand b{font-size:19px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;padding:8px 14px;font-size:14.5px}
  .nav button svg{width:19px;height:19px}
  .quote{display:none}
  .rail-foot{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:14px;margin:0}
  .rail-timer{width:auto;padding:7px 10px;font-size:13.5px}
  .main{padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar{position:static;justify-content:flex-end;margin-bottom:6px}
  .round-btn,.avatar{width:40px;height:40px}
  .save-btn{height:40px}
  .ph>div:first-child{padding-right:0}
  .matrix,.axis{grid-template-columns:1fr}
  .axis{display:none}
  .sheet-wrap{place-items:end center;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .fields{grid-template-columns:1fr}
  .act-row{grid-template-columns:1fr 1fr}
  .act-row .a-title{grid-column:1/-1}
}
@media (max-width:520px){
  .tiles{gap:10px}
  .tile{padding:14px}
  .tile b{font-size:30px}
  .save-btn .t small{display:none}
  .bigstat div+div{padding-left:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand"><svg class="logo" viewBox="0 0 44 48" aria-hidden="true" style="stroke:none"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#D97706"/></linearGradient></defs><g fill="none" stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round"><path d="M22 9v36"/><path d="M8.5 9c0 9 3 15.5 13.5 15.5S35.5 18 35.5 9"/><path d="M16 33h12"/></g><g fill="url(#gold)"><path d="M22 1.5l4.2 9-4.2-2-4.2 2z"/><path d="M8.5 2.5l3.6 8-3.6-1.8-3.6 1.8z"/><path d="M35.5 2.5l3.6 8-3.6-1.8-3.6 1.8z"/></g></svg><div><b>Daybook</b><small>Plan · Track · Achieve</small></div></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="rail-foot">

<script>
(function(){

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmt = (s, o={weekday:'short', day:'numeric', month:'short'}) => s ? parse(s).toLocaleDateString(undefined, o) : '';
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear(); return {y, w: Math.ceil(((t - Date.UTC(y,0,1)) / 864e5 + 1) / 7)}; };
const weekKeyOf = s => { const {y,w} = isoWeek(parse(s)); return `${y}-W${pad(w)}`; };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

const mins = m => m >= 60 ? `${Math.floor(m/60)}h ${pad(m%60)}m` : `${m}m`;

const I = {

  note: svg('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>'),
  chat: svg('<path d="M4 12a8 8 0 1 1 3.2 6.4L3.5 20l1.3-3.7A8 8 0 0 1 4 12z"/>'),
  alert: svg('<path d="M12 3.5l9 16H3z"/><path d="M12 10v4.5M12 17.5v.01"/>'),

  play: svg('<path d="M7 4.5v15l12-7.5z"/>'),
  calc: svg('<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="16" cy="16" r="3.2"/><path d="M16 14.6v1.6l1 .8"/>'),

  settings: svg('<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>')
};

const CATS = ['Report','Referee report','Grant','Conference','Teaching','Admin','Other'];
const QUADS = [
  {id:'do', name:'Do now', sub:'Urgent and important'},
  {id:'plan', name:'Schedule', sub:'Important, not urgent'},
  {id:'delegate', name:'Delegate', sub:'Urgent, not important'},
  {id:'drop', name:'Drop or defer', sub:'Neither urgent nor important'}
];
const RSTAT = [['toread','To read'],['reading','Reading'],['done','Done']];
const NAV = [
  ['today','Today',I.home],['deadlines','Deadlines',I.flag],['priorities','Priorities',I.checkc],['waiting','Waiting on',I.hour],
  ['reading','Reading list',I.book],['meetings','Meetings',I.users],['week','Weekly plan',I.cal],['focus','Focus timer',I.timer]
];

/* ---------- State and storage ---------- */
const S = { items:new Map(), mode:'init', loaded:false, col:null, name:'', page:'today',
  weekStart: mondayOf(today()), rfilter:'reading', dcat:'All', calMonth: today().slice(0,7), calSel: today() };
const startHash = (location.hash || '').slice(1);
S.page = NAV.some(n => n[0] === startHash) ? startHash : (NAV.some(n => n[0] === lsGet('daybook.page')) ? lsGet('daybook.page') : 'today');

const all = () => [...S.items.values()];
const ofKind = k => all().filter(i => i.kind === k);
const openOf = k => ofKind(k).filter(i => !i.done);
const byDue = (a,b) => (a.due || '9999').localeCompare(b.due || '9999');

const pending = new Set(), queued = new Set();
let chain = Promise.resolve();
function saveLocal(){ lsSet('daybook.items.v1', JSON.stringify(all())); }
function persist(id){
  lsSet('daybook.lastChange', String(Date.now()));
  if (S.mode !== 'db') { saveLocal(); renderBrand(); return; }
  pending.add(id);
  if (queued.has(id)) return;
  queued.add(id);
  chain = chain.then(async () => {
    queued.delete(id);
    const cur = S.items.get(id), ref = S.col.doc(id);
    try { if (cur) { const body = {...cur}; delete body.id; await ref.set(body); } else await ref.delete(); }
    catch (e) {
      toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete some old items, then try again.' : "That change didn't save. Check your connection and try again.");
    } finally { if (!queued.has(id)) pending.delete(id); }
  });
}
function put(item){ item.updatedAt = Date.now(); S.items.set(item.id, item); queueRender(); persist(item.id); }
function remove(id){ S.items.delete(id); queueRender(); persist(id); }
function removeMany(list, msg){ list.forEach(i => remove(i.id)); toast(msg, () => list.forEach(i => put({...i}))); }

function useLocal(){
  S.mode = 'local';
  try { (JSON.parse(lsGet('daybook.items.v1') || '[]') || []).forEach(i => S.items.set(i.id, i)); } catch {}
  S.loaded = true; render();
}
function boot(){
  S.name = lsGet('daybook.name') || '';
  $('#hero').innerHTML = sceneSVG('h', '0 0 1200 380');
  $('#quoteScene').innerHTML = sceneSVG('q', '760 40 440 340');
  $('#quoteText').textContent = QUOTES[Math.floor(Date.now() / 864e5) % QUOTES.length];
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  useLocal();
  let asked = false;
  try { asked = sessionStorage.getItem('daybook.asked') === '1'; sessionStorage.setItem('daybook.asked', '1'); } catch {}
  if (!asked && lsGet('daybook.askOnOpen') !== 'no') openLoadPrompt();
}
function openLoadPrompt(){

  const saved = Number(lsGet('daybook.lastSavedAt') || 0);
  $('#sheet').innerHTML = `<div class="prompt">
    <h2>Load your Daybook file?</h2>
    <p>Choose your Daybook.md file to bring in your latest items.${saved ? ` You last saved on ${new Date(saved).toLocaleString([], {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'})}.` : ''}</p>
    <label class="toggle"><input type="checkbox" id="askToggle" data-act="toggle-ask" ${lsGet('daybook.askOnOpen') === 'no' ? '' : 'checked'}>Ask me each time I open Daybook</label>
    <div class="acts"><button class="btn ghost" data-act="close-sheet">Not now</button><button class="btn primary" data-act="prompt-load">Choose file</button></div>
  </div>`;
  $('#sheetWrap').hidden = false;
}

/* ---------- Backup and restore (Markdown) ---------- */
const MD_SECTIONS = [
  ['deadline','Deadlines',['due','category','notes']],
  ['task','Priorities',['quadrant','due','notes']],
  ['waiting','Waiting on',['who','asked','followup','lastChased','notes']],
  ['reading','Reading list',['status','source','link','why']],
  ['meeting','Meetings',['date','attendees','notes']],
  ['action','Action items',['owner','due','meeting']],
  ['week','Weekly plans',['week','wentWell','slipped','nextWeek']],
  ['focus','Focus sessions',['date']]
];
const CHECKABLE = ['deadline','task','waiting','action'];
const NUM_FIELDS = ['createdAt','updatedAt'];
const SKIP_FIELDS = ['id','kind','title','done','priorities','sessions','meetingId','example'];
const esc1 = v => String(v ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n');
const unesc1 = v => String(v).replace(/\\(\\|n)/g, (m, c) => c === 'n' ? '\n' : '\\');
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function toMarkdown(items){
  const now = new Date();
  const out = [
    '# Daybook', '',
    `Exported ${today()} at ${hhmm(now)}`, '',
    '> Each item starts with "- " under its section. Details go on indented "  - field: value" lines.',
    '> Keep the id line so restoring updates the same item instead of adding a copy.',
    '> New items can be added by hand without an id.', ''
  ];
  for (const [kind, heading, order] of MD_SECTIONS) {
    const its = items.filter(i => i.kind === kind);
    if (!its.length) continue;
    out.push(`## ${heading}`, '');
    for (const it of its) {
      if (kind === 'week') out.push(`- Week ${esc1(it.week || it.id.replace(/^week-/, ''))}`);
      else if (kind === 'focus') out.push(`- ${esc1(it.date)}`);
      else out.push(`- ${CHECKABLE.includes(kind) ? (it.done ? '[x] ' : '[ ] ') : ''}${esc1(it.title)}`);
      const f = (k, v) => { if (v !== undefined && v !== null && v !== '') out.push(`  - ${k}: ${esc1(v)}`); };
      order.forEach(k => f(k, k === 'meeting' ? it.meetingId : it[k]));
      if (kind === 'week') (it.priorities || []).forEach(p => { if (p.text) out.push(`  - priority: [${p.done ? 'x' : ' '}] ${esc1(p.text)}`); });
      if (kind === 'focus') (it.sessions || []).forEach(s => out.push(`  - session: ${hhmm(s.at)} · ${s.minutes} min · ${esc1(s.project || 'General')}${s.ex ? ' · example' : ''}`));
      Object.keys(it).forEach(k => { if (!order.includes(k) && !SKIP_FIELDS.includes(k)) f(k, it[k]); });
      if (it.example) out.push('  - example: yes');
      out.push(`  - id: ${esc1(it.id)}`);
    }
    out.push('');
  }
  return out.join('\n');
}

function fromMarkdown(md){
  const byHeading = {};
  MD_SECTIONS.forEach(([k, h]) => { byHeading[h.toLowerCase()] = k; });
  byHeading['tasks'] = 'task'; byHeading['reading'] = 'reading'; byHeading['actions'] = 'action'; byHeading['focus'] = 'focus'; byHeading['weekly plan'] = 'week';
  const items = []; let kind = null, cur = null;
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, ''); let m;
    if ((m = line.match(/^#{2,3}\s+(.+)$/))) { kind = byHeading[m[1].trim().toLowerCase()] || null; cur = null; continue; }
    if (!kind) continue;
    if ((m = line.match(/^[-*] (?:\[( |x|X)\] )?(.+)$/))) {
      cur = {kind, title:unesc1(m[2].trim())};
      if (CHECKABLE.includes(kind)) cur.done = !!m[1] && m[1].toLowerCase() === 'x';
      if (kind === 'week') { cur.priorities = []; const w = cur.title.match(/(\d{4}-W\d{2})/); if (w) cur.week = w[1]; }
      if (kind === 'focus') { cur.sessions = []; const d = cur.title.match(/(\d{4}-\d{2}-\d{2})/); if (d) cur.date = d[1]; }
      items.push(cur); continue;
    }
    if (cur && (m = line.match(/^\s+[-*] ([A-Za-z]+):\s?(.*)$/))) {
      const k = m[1], v = m[2];
      if (kind === 'week' && k === 'priority') { const p = v.match(/^\[( |x|X)\]\s?(.*)$/); cur.priorities.push(p ? {text:unesc1(p[2]), done:p[1].toLowerCase() === 'x'} : {text:unesc1(v), done:false}); }
      else if (kind === 'focus' && k === 'session') {
        const s = v.match(/^(\d{1,2}):(\d{2})\s*·\s*(\d+)\s*min\s*·\s*(.*?)(\s*·\s*example)?$/);
        if (s) cur.sessions.push({hh:+s[1], mm:+s[2], minutes:+s[3], project:unesc1(s[4]) || 'General', ex:!!s[5]});
      }
      else if (k === 'meeting') cur.meetingId = unesc1(v);
      else if (k === 'example') cur.example = /^(yes|true)$/i.test(v);
      else if (NUM_FIELDS.includes(k)) cur[k] = Number(v) || 0;
      else cur[k] = unesc1(v);
    }
  }
  return items.map(it => {
    if (it.kind === 'week') {
      if (!it.week) return null;
      it.id = 'week-' + it.week; delete it.title;
      while (it.priorities.length < 3) it.priorities.push({text:'', done:false});
      it.priorities = it.priorities.slice(0, 3);
      ['wentWell','slipped','nextWeek'].forEach(k => { it[k] = it[k] || ''; });
    } else if (it.kind === 'focus') {
      if (!it.date) return null;
      it.id = 'focus-' + it.date; delete it.title;
      const base = parse(it.date);
      it.sessions = it.sessions.map(s => { const d = new Date(base); d.setHours(s.hh, s.mm, 0, 0); const o = {project:s.project, minutes:s.minutes, at:d.getTime()}; if (s.ex) o.ex = true; return o; });
    } else {
      if (!it.title) return null;
      it.id = it.id || newId();
      if (it.kind === 'reading' && !it.status) it.status = 'toread';
      if (it.kind === 'task' && !it.quadrant) it.quadrant = 'do';
    }
    it.createdAt = it.createdAt || Date.now();
    return it;
  }).filter(Boolean);
}

function appBridge(){ try { return (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.daybook) || null; } catch { return null; } }
function markSaved(){ lsSet('daybook.lastSavedAt', String(Date.now())); lsSet('daybook.lastBackup', today()); render(); }
const isUnsaved = () => Number(lsGet('daybook.lastChange') || 0) > Number(lsGet('daybook.lastSavedAt') || 0);
function exportData(){
  const data = toMarkdown(all());
  const filename = 'Daybook.md';
  const bridge = appBridge();
  if (bridge) {
    bridge.postMessage({filename, data});
    markSaved(); toast('Choose where to save your file'); return;
  }
  // On iPad and iPhone, the share sheet lets you "Save to Files" and replace the same Daybook.md each time.
  let file = null;
  try { file = new File([data], filename, {type:'text/plain'}); } catch {}
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (touch && file && navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file]})
      .then(() => { markSaved(); toast('Saved Daybook.md'); })
      .catch(e => { if (e && e.name === 'AbortError') toast('Not saved. Tap Save when you are ready.'); else downloadFile(data, filename); });
    return;
  }
  downloadFile(data, filename);
}
function downloadFile(data, filename){
  const blob = new Blob([data], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  markSaved(); toast('Saved Daybook.md to your downloads');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    let items = [];
    const text = String(r.result || '');
    if (/^\s*[\[{]/.test(text)) {
      try { const j = JSON.parse(text); items = Array.isArray(j) ? j : (j.items || []); } catch {}
    } else items = fromMarkdown(text);
    if (!items.length) { toast("No Daybook items found in that file. Choose a Markdown file saved from Daybook."); return; }
    let added = 0;
    items.forEach(it => {
      if (!it || !it.id || !it.kind) return;
      const cur = S.items.get(it.id);
      if (!cur || (it.updatedAt || 0) > (cur.updatedAt || 0)) { S.items.set(it.id, it); added++; }
    });
    saveLocal();
    if (!isUnsaved() || Number(lsGet('daybook.lastSavedAt') || 0) === 0) lsSet('daybook.lastSavedAt', String(Date.now()));
    render();
    toast(added ? `Loaded ${added} item${added === 1 ? '' : 's'} from ${file.name}` : `You're up to date with ${file.name}`);
  };
  r.readAsText(file);
}
document.addEventListener('change', e => {
  if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
});
function backupCard(){
  const saved = Number(lsGet('daybook.lastSavedAt') || 0);

/* ---------- Month calendar ---------- */
const CTYPE = {deadline:['Deadline','var(--accent)'], task:['Task','var(--amber)'], action:['Action item','var(--amber)'], chase:['Chase','var(--green)'], meeting:['Meeting','var(--muted)']};
function datedEntries(){
  const map = {};
  const add = (ds, type, it) => { if (ds) (map[ds] = map[ds] || []).push({type, it}); };
  all().forEach(i => {
    if (i.kind === 'deadline') add(i.due, 'deadline', i);
    else if (i.kind === 'task' || i.kind === 'action') add(i.due, i.kind, i);
    else if (i.kind === 'waiting' && !i.done) add(i.followup, 'chase', i);
    else if (i.kind === 'meeting') add(i.date, 'meeting', i);
  });
  const order = ['deadline','meeting','task','action','chase'];
  Object.values(map).forEach(a => a.sort((x,y) => order.indexOf(x.type) - order.indexOf(y.type)));
  return map;
}
function agendaRow({type, it}){

}

  out += `<div class="tiles">
    <button class="tile t-blue ${overdue.length ? 'alert' : ''}" data-page="deadlines">${chip('calc','blue')}<b>${overdue.length}</b><span class="l">Overdue</span></button>
    <button class="tile t-violet" data-page="deadlines">${chip('cal','violet')}<b>${due7.length}</b><span class="l">Due in 7 days</span></button>
    <button class="tile t-green" data-page="waiting">${chip('checkc','green')}<b>${waiting.length}</b><span class="l">Waiting on</span></button>
    <button class="tile t-amber" data-page="meetings">${chip('list','amber')}<b>${actions.length}</b><span class="l">Open actions</span></button>
  </div>`;

  const prios = wk.priorities.filter(p => p.text);
  const prioHtml = prios.length ? `<ul class="list">${wk.priorities.map((p,i) => p.text ? `<li class="row ${p.done ? 'is-done' : ''}"><label class="check"><input type="checkbox" data-wkcheck="${i}" data-wk="${key}" ${p.done ? 'checked' : ''} aria-label="Mark priority done"><span></span></label><span class="row-main"><span class="row-title">${h(p.text)}</span></span></li>` : '').join('')}</ul>`
    : `<p class="empty">${I.cal}<span>No priorities set for this week.</span></p><div><button class="btn primary" data-page="week">Set three priorities</button></div>`;

  out += `<div class="grid2">
    <div class="col">
      ${card('Coming up', list(dls.slice(0,6), deadlineRow, 'Nothing due. Add a deadline to see it here.'), `<button class="link" data-page="deadlines">All deadlines</button>`)}
      ${card('Do now', list(doNow.slice(0,5), taskRow, 'Nothing urgent and important. Nice.'), `<button class="link" data-page="priorities">Priorities</button>`)}
      ${card('Action items', list(actions.slice(0,5), actionRow, 'No open action items.'), `<button class="link" data-page="meetings">Meetings</button>`)}
    </div>
    <div class="col">
      ${card('This week', prioHtml, `<button class="link" data-page="week">Weekly plan</button>`)}
      ${card('Waiting on', list(waiting.slice(0,4), waitingRow, 'Not waiting on anyone.', 'chat'), `<button class="link" data-page="waiting">All</button>`)}
      ${card('Focus today', `<div class="bigstat"><div><b>${mins(fToday)}</b><span>focused today</span></div><div><b>${mins(sumObj(focusByDay(mondayOf(t), t)))}</b><span>this week</span></div></div><div><button class="btn primary" data-page="focus">${I.play}<span>Start a session</span></button></div>`)}
      ${reading.length ? card('Reading now', `<ul class="list">${reading.slice(0,3).map(r => `<li class="row"><button class="row-main" data-edit="${h(r.id)}"><span class="row-title">${h(r.title)}${exTag(r)}</span><span class="row-meta">${h(r.source || '')}</span></button></li>`).join('')}</ul>`, `<button class="link" data-page="reading">Reading list</button>`) : ''}
    </div>
  </div>`;
  return out + calendarCard() + backupCard();
},

deadlines(){
  const t = today();
  const items = ofKind('deadline');
  const cats = ['All', ...CATS.filter(c => items.some(i => (i.category || 'Other') === c))];
  if (!cats.includes(S.dcat)) S.dcat = 'All';
  const f = i => S.dcat === 'All' || (i.category || 'Other') === S.dcat;
  const open = items.filter(i => !i.done && f(i)).sort(byDue);
  const done = items.filter(i => i.done && f(i)).sort((a,b) => (b.due || '').localeCompare(a.due || ''));
  const overdue = open.filter(i => diff(t, i.due) < 0), soon = open.filter(i => { const n = diff(t,i.due); return n >= 0 && n <= 14; }), later = open.filter(i => diff(t, i.due) > 14);
  let out = head('Deadlines', 'Reports, referee reports, grants and submissions, sorted by how soon they land.', addBtn('deadline','Add deadline'));
  if (cats.length > 2) out += `<div class="chips">${cats.map(c => `<button class="chip" data-dcat="${h(c)}" aria-pressed="${S.dcat === c}">${h(c)}</button>`).join('')}</div>`;
  if (!open.length && !done.length) return out + card('Nothing yet', `<p class="empty">Add your first deadline and it will count down here.</p>`);
  if (overdue.length) out += card('Overdue', list(overdue, deadlineRow, ''), `<span class="count">${overdue.length}</span>`);
  out += card('Next two weeks', list(soon, deadlineRow, 'Nothing due in the next two weeks.'), `<span class="count">${soon.length}</span>`);
  if (later.length) out += card('Later', list(later, deadlineRow, ''), `<span class="count">${later.length}</span>`);
  if (done.length) out += `<section class="card"><details class="done-list"><summary>Completed (${done.length})</summary>${list(done, deadlineRow, '')}</details></section>`;
  return out;
},

priorities(){
  const tasks = ofKind('task');
  const anyDone = tasks.some(t => t.done);
  let out = head('Priorities', 'Sort tasks by urgency and importance. Tap a task to move it to another box.',
    `<div style="display:flex;gap:8px;flex-wrap:wrap">${anyDone ? `<button class="btn ghost" data-act="clear-done">Clear done</button>` : ''}${addBtn('task','Add task')}</div>`);
  out += `<div class="axis"><span>Urgent</span><span>Not urgent</span></div><div class="matrix">`;
  ['do','plan','delegate','drop'].forEach(qid => {
    const q = QUADS.find(x => x.id === qid);
    const its = tasks.filter(t => (t.quadrant || 'do') === qid).sort((a,b) => (a.done - b.done) || byDue(a,b));
    const qt = {do:['bolt','red'], plan:['cal','blue'], delegate:['users','amber'], drop:['x','slate']}[qid];
    out += `<section class="card quad" style="--tc:${TONE[qt[1]]}"><div class="card-h"><div class="ch-left">${chip(qt[0], qt[1])}<div><h2>${q.name}</h2><p>${q.sub}</p></div></div><button class="icon-btn" data-add="task" data-preset="${h(JSON.stringify({quadrant:qid}))}" aria-label="Add to ${q.name}">${I.plus}</button></div>
      ${list(its, taskRow, 'Empty')}</section>`;
  });
  return out + `</div>`;
},

waiting(){
  const items = ofKind('waiting');
  const open = items.filter(i => !i.done).sort((a,b) => (a.followup || '9999').localeCompare(b.followup || '9999'));
  const done = items.filter(i => i.done);
  const chaseNow = open.filter(i => i.followup && diff(today(), i.followup) <= 0);
  let out = head('Waiting on', 'Data, sign-offs and replies you have asked others for. Tick an item when it arrives.', addBtn('waiting','Add item'));
  if (!items.length) return out + card('Nothing yet', `<p class="empty">Add something you're waiting on, and set a date to chase it.</p>`);
  if (chaseNow.length) out += card('Chase now', list(chaseNow, waitingRow, ''), `<span class="count">${chaseNow.length}</span>`);
  const rest = open.filter(i => !chaseNow.includes(i));
  out += card(chaseNow.length ? 'Still waiting' : 'Open', list(rest, waitingRow, 'Nothing else outstanding.'), `<span class="count">${rest.length}</span>`);
  if (done.length) out += `<section class="card"><details class="done-list"><summary>Received (${done.length})</summary>${list(done, waitingRow, '')}</details></section>`;
  return out;
},

reading(){
  const items = ofKind('reading');
  const cnt = s => items.filter(i => (i.status || 'toread') === s).length;
  const shown = items.filter(i => (i.status || 'toread') === S.rfilter).sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  let out = head('Reading list', 'Papers, reports and articles, with a note on why each one matters.', addBtn('reading','Add reading', {status:S.rfilter}));
  out += `<div class="chips">${RSTAT.map(([k,l]) => `<button class="chip" data-rfilter="${k}" aria-pressed="${S.rfilter === k}">${l}<span class="n">${cnt(k)}</span></button>`).join('')}</div>`;
  if (!shown.length) return out + card('Nothing here', `<p class="empty">${items.length ? 'No items with this status.' : 'Add a paper or report you want to get to.'}</p>`);
  return out + `<div class="rgrid">${shown.map(r => `<article class="card rcard">
    <button class="title-btn" data-edit="${h(r.id)}">${h(r.title)}${exTag(r)}</button>
    ${r.source ? `<p class="src">${h(r.source)}</p>` : ''}
    ${r.why ? `<p class="why">${h(r.why)}</p>` : ''}
    <div class="foot">
      <select class="mini" data-status="${h(r.id)}" aria-label="Status">${RSTAT.map(([k,l]) => `<option value="${k}" ${(r.status || 'toread') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${/^https?:\/\//i.test(r.link || '') ? `<a class="ext" href="${h(r.link)}" target="_blank" rel="noopener">Open ${I.ext}</a>` : ''}
      <span class="grow"></span>
      <button class="icon-btn" data-del="${h(r.id)}" aria-label="Delete">${I.trash}</button>
    </div></article>`).join('')}</div>`;
},

meetings(){
  const mtgs = ofKind('meeting').sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  const acts = ofKind('action');
  const open = acts.filter(a => !a.done).sort(byDue);
  let out = head('Meetings', 'Log a meeting and its action items. Every open action item is collected at the top.', addBtn('meeting','Log meeting'));
  out += card('Open action items', list(open, actionRow, 'No open action items.'), `<div style="display:flex;align-items:center;gap:6px"><span class="count">${open.length}</span><button class="icon-btn" data-add="action" aria-label="Add action item">${I.plus}</button></div>`);
  if (!mtgs.length) return out + card('No meetings yet', `<p class="empty">Log your next meeting to keep notes and action items together.</p>`);
  out += `<div class="grid2">` + mtgs.map(m => {
    const its = acts.filter(a => a.meetingId === m.id).sort((a,b) => (a.done - b.done) || byDue(a,b));
    return `<article class="card mtg">
      <div class="card-h"><div class="ch-left">${chip('users','violet')}<div><p class="when">${fmt(m.date, {weekday:'short', day:'numeric', month:'short', year:'numeric'})}</p><h2><button class="row-main" style="font:inherit" data-edit="${h(m.id)}">${h(m.title)}${exTag(m)}</button></h2></div></div>
      <button class="icon-btn" data-del="${h(m.id)}" aria-label="Delete meeting">${I.trash}</button></div>
      ${m.attendees ? `<p class="who">With ${h(m.attendees)}</p>` : ''}
      ${m.notes ? `<p class="notes">${h(m.notes)}</p>` : ''}
      ${its.length ? list(its, actionRow, '') : ''}
      <div><button class="link" data-add="action" data-preset="${h(JSON.stringify({meetingId:m.id}))}">+ Add action item</button></div>
    </article>`;
  }).join('') + `</div>`;
  return out;
},

week(){
  const mon = S.weekStart, sun = addDays(mon, 6), key = weekKeyOf(mon), wk = weekDoc(key);
  const {w, y} = isoWeek(parse(mon));
  const isNow = mon === mondayOf(today());
  const dl = ofKind('deadline').filter(d => d.due >= mon && d.due <= sun).sort(byDue);
  const fm = sumObj(focusByDay(mon, sun));
  const nav = `<div class="weeknav"><button class="icon-btn" data-act="week-prev" aria-label="Previous week">${I.left}</button><span class="lbl">Week ${w} · ${fmt(mon, {day:'numeric', month:'short'})} – ${fmt(sun, {day:'numeric', month:'short'})}</span><button class="icon-btn" data-act="week-next" aria-label="Next week">${I.right}</button>${isNow ? '' : `<button class="btn ghost" data-act="week-now">This week</button>`}</div>`;
  let out = head('Weekly plan', 'Pick three priorities on Monday. Look back on Friday.', nav, `${y} · Week ${w}`);
  out += `<div class="grid2"><section class="card"><div class="card-h"><div class="ch-left">${chip('checkc','blue')}<h2>Three priorities</h2></div>${exTag(wk)}</div><div class="prios">` +
    wk.priorities.map((p,i) => `<div class="prio ${p.done ? 'is-done' : ''}"><span class="num">${i+1}</span><input type="text" id="wp-${i}" data-wktext="${i}" data-wk="${key}" value="${h(p.text)}" placeholder="Priority ${i+1}" aria-label="Priority ${i+1}"><label class="check"><input type="checkbox" data-wkcheck="${i}" data-wk="${key}" ${p.done ? 'checked' : ''} aria-label="Mark priority ${i+1} done"><span></span></label></div>`).join('') +
    `</div></section>` +
    card('This week at a glance', `${list(dl, deadlineRow, 'No deadlines this week.')}<div class="bigstat"><div><b>${mins(fm)}</b><span>focused this week</span></div><div><b>${wk.priorities.filter(p => p.done && p.text).length}/${wk.priorities.filter(p => p.text).length || 3}</b><span>priorities done</span></div></div>`) +
    `</div>`;
  out += `<section class="card review"><div class="card-h"><div class="ch-left">${chip('note','violet')}<h2>Friday review</h2></div></div><div class="grid2">
    <label>What went well<textarea id="wr-well" data-wkfield="wentWell" data-wk="${key}" placeholder="Wins, finished work, good calls">${h(wk.wentWell)}</textarea></label>
    <label>What slipped, and why<textarea id="wr-slip" data-wkfield="slipped" data-wk="${key}" placeholder="What didn't get done">${h(wk.slipped)}</textarea></label>
    <label>Carry into next week<textarea id="wr-next" data-wkfield="nextWeek" data-wk="${key}" placeholder="Priorities to roll forward">${h(wk.nextWeek)}</textarea></label>
  </div></section>`;
  return out;
},

focus(){
  const t = today(), mon = mondayOf(t), sun = addDays(mon, 6);
  const days = focusByDay(mon, sun), byP = focusByProject(mon, sun);
  const max = Math.max(1, ...Object.values(days));
  const projects = [...new Set(ofKind('focus').flatMap(f => (f.sessions || []).map(s => s.project)).filter(Boolean)), ...openOf('deadline').map(d => d.title)].slice(0, 20);
  const todaySessions = (S.items.get('focus-' + t)?.sessions || []).slice().reverse();
  const pMax = Math.max(1, ...byP.map(p => p[1]));
  let out = head('Focus timer', 'Work in focused blocks and log where the time goes.');
  out += `<section class="card"><div class="focus-top">
    <div class="ring" id="tRing"><div class="ring-in"><span class="digits" id="tDigits">25:00</span><small id="tLabel"></small></div></div>
    <div class="fctl">
      <label for="tProject">Working on<input type="text" id="tProject" list="tProjects" value="${h(T.project)}" placeholder="e.g. Quarterly review"></label>
      <datalist id="tProjects">${projects.map(p => `<option value="${h(p)}">`).join('')}</datalist>
      <div><div style="font-weight:600;font-size:14px;margin-bottom:6px">Length</div><div class="chips">${[25,50,90].map(m => `<button class="chip" data-act="t-dur" data-v="${m}" aria-pressed="${T.dur === m}" ${T.running ? 'disabled' : ''}>${m} min</button>`).join('')}</div></div>
      <div class="btns">
        <button class="btn primary" data-act="${T.running ? 't-pause' : 't-start'}">${T.running ? 'Pause' : (T.remaining < T.dur*60e3 ? 'Resume' : 'Start')}</button>
        <button class="btn ghost" data-act="t-finish" ${T.remaining >= T.dur*60e3 && !T.running ? 'disabled' : ''}>Finish and log</button>
        <button class="btn ghost" data-act="t-reset">Reset</button>
      </div>
    </div></div></section>`;
  out += `<div class="grid2">` + card('This week', `<div class="cols" role="img" aria-label="Focus minutes per day this week">${[0,1,2,3,4,5,6].map(i => { const d = addDays(mon, i), m = days[d] || 0; return `<div class="c ${m ? '' : 'zero'} ${d === t ? 'today' : ''}"><em>${m ? m : ''}</em><i style="height:${Math.max(2, Math.round(m / max * 100))}%"></i><span>${fmt(d, {weekday:'narrow'})}</span></div>`; }).join('')}</div><div class="bigstat"><div><b>${mins(days[t] || 0)}</b><span>today</span></div><div><b>${mins(sumObj(days))}</b><span>this week</span></div></div>`) +
    card('By project this week', byP.length ? `<div class="bars">${byP.map(([p,m]) => `<div class="b"><span>${h(p)}</span><em>${mins(m)}</em><div class="track"><i style="width:${Math.round(m / pMax * 100)}%"></i></div></div>`).join('')}</div>` : `<p class="empty">Finish a session to see your time by project.</p>`) + `</div>`;
  out += card("Today's sessions", todaySessions.length ? `<ul class="list">${todaySessions.map(s => `<li class="row"><span class="row-main"><span class="row-title">${h(s.project || 'General')}${s.ex ? '<em class="ex">Example</em>' : ''}</span><span class="row-meta">${new Date(s.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</span></span>${pill('blue', mins(s.minutes))}</li>`).join('')}</ul>` : `<p class="empty">No sessions yet today.</p>`);
  return out;
}
};

/* ---------- Forms ---------- */
const SCHEMAS = {
  deadline: {label:'deadline', fields:[
    {k:'title', l:'What is due', req:1, ph:'e.g. Referee report for the journal'},
    {k:'category', l:'Type', t:'select', opts:CATS, def:'Report', half:1},
    {k:'due', l:'Due date', t:'date', req:1, def:() => addDays(today(), 7), half:1},
    {k:'notes', l:'Notes', t:'textarea'}]},
  task: {label:'task', fields:[
    {k:'title', l:'Task', req:1, ph:'e.g. Update the inflation forecast'},
    {k:'quadrant', l:'Box', t:'select', opts:QUADS.map(q => [q.id, `${q.name} (${q.sub.toLowerCase()})`]), def:'do', half:1},
    {k:'due', l:'Due date', t:'date', half:1},
    {k:'notes', l:'Notes', t:'textarea'}]},
  waiting: {label:'waiting item', fields:[
    {k:'title', l:'What you asked for', req:1, ph:'e.g. Revised trade data'},
    {k:'who', l:'Who has it', req:1, ph:'Person or office'},
    {k:'asked', l:'Asked on', t:'date', def:today, half:1},
    {k:'followup', l:'Chase on', t:'date', def:() => addDays(today(), 3), half:1},
    {k:'notes', l:'Notes', t:'textarea'}]},
  reading: {label:'reading', fields:[
    {k:'title', l:'Title', req:1},
    {k:'source', l:'Authors or source', ph:'e.g. Author (Year), Journal'},
    {k:'link', l:'Link', t:'url', ph:'https://', half:1},
    {k:'status', l:'Status', t:'select', opts:RSTAT, def:'toread', half:1},
    {k:'why', l:'Why it matters', t:'textarea'}]},
  meeting: {label:'meeting', actions:true, fields:[
    {k:'title', l:'Meeting', req:1, ph:'e.g. Research team check-in'},
    {k:'date', l:'Date', t:'date', req:1, def:today, half:1},
    {k:'attendees', l:'With', half:1, ph:'People or team'},
    {k:'notes', l:'Notes', t:'textarea'}]},
  action: {label:'action item', fields:[
    {k:'title', l:'Action', req:1},
    {k:'owner', l:'Owner', def:'Me', half:1},
    {k:'due', l:'Due date', t:'date', half:1, def:() => addDays(today(), 7)}]}
};
let sheetCtx = null, lastFocus = null;
function openSheet(kind, id, preset={}){
  const sc = SCHEMAS[kind]; if (!sc) return;
  const it = id ? S.items.get(id) : null;
  sheetCtx = {kind, id, preset};
  lastFocus = document.activeElement;
  const val = f => { if (it) return it[f.k] ?? ''; if (preset[f.k] != null) return preset[f.k]; return typeof f.def === 'function' ? f.def() : (f.def ?? ''); };
  const field = f => {
    const v = val(f), idA = `f-${f.k}`;
    let ctl;
    if (f.t === 'select') ctl = `<select id="${idA}">${f.opts.map(o => { const [k,l] = Array.isArray(o) ? o : [o,o]; return `<option value="${h(k)}" ${k === v ? 'selected' : ''}>${h(l)}</option>`; }).join('')}</select>`;
    else if (f.t === 'textarea') ctl = `<textarea id="${idA}" placeholder="${h(f.ph || '')}">${h(v)}</textarea>`;
    else ctl = `<input id="${idA}" type="${f.t || 'text'}" value="${h(v)}" placeholder="${h(f.ph || '')}" ${f.t === 'url' ? 'inputmode="url"' : ''}>`;
    return `<label class="field ${f.half ? 'half' : ''}" for="${idA}"><span>${f.l}${f.req || f.t === 'select' ? '' : ' <i>optional</i>'}</span>${ctl}</label>`;
  };
  const actRow = n => `<div class="act-row"><input type="text" class="a-title" id="a-title-${n}" placeholder="Action item" aria-label="Action item"><input type="text" class="a-owner" id="a-owner-${n}" value="Me" aria-label="Owner"><input type="date" class="a-due" id="a-due-${n}" aria-label="Due date"></div>`;
  $('#sheet').innerHTML = `<form id="sheetForm" novalidate>
    <header><h2>${it ? 'Edit' : 'New'} ${sc.label}</h2><button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">${I.x}</button></header>
    <div class="fields">${sc.fields.map(field).join('')}</div>
    ${sc.actions && !it ? `<div class="acts-rep" id="actsRep"><h3>Action items <i style="font-weight:400;color:var(--faint);font-style:normal">optional</i></h3>${actRow(0)}${actRow(1)}<div><button type="button" class="link" data-act="add-act-row">+ Another action item</button></div></div>` : ''}
    <p class="form-err" id="formErr" hidden></p>
    <footer>${it ? `<button type="button" class="btn ghost danger" data-act="sheet-delete">Delete</button>` : ''}<span class="grow"></span><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn primary" type="submit">${it ? 'Save changes' : 'Add ' + sc.label}</button></footer>
  </form>`;
  $('#sheetWrap').hidden = false;
  setTimeout(() => { const f = $('#sheet input, #sheet textarea'); if (f && !id) f.focus(); }, 30);
}
function closeSheet(){ $('#sheetWrap').hidden = true; sheetCtx = null; S.alertsOpen = false; if (lastFocus && lastFocus.focus) try { lastFocus.focus({preventScroll:true}); } catch {} }
document.addEventListener('submit', e => {
  if (e.target.id !== 'sheetForm') return;
  e.preventDefault();
  const {kind, id, preset} = sheetCtx, sc = SCHEMAS[kind];
  const vals = {};
  for (const f of sc.fields) vals[f.k] = ($('#f-' + f.k).value || '').trim();
  const missing = sc.fields.filter(f => f.req && !vals[f.k]);
  if (missing.length) { const el = $('#formErr'); el.textContent = `Add ${missing.map(f => f.l.toLowerCase()).join(' and ')} to save.`; el.hidden = false; $('#f-' + missing[0].k).focus(); return; }
  if (vals.link && !/^https?:\/\//i.test(vals.link)) vals.link = 'https://' + vals.link;
  const base = id ? {...S.items.get(id)} : {id:newId(), kind, done:false, createdAt:Date.now(), ...preset};
  if (id) delete base.example;
  const item = {...base, ...vals};
  put(item);
  if (sc.actions && !id) {
    document.querySelectorAll('#actsRep .act-row').forEach(r => {
      const title = r.querySelector('.a-title').value.trim();
      if (title) put({id:newId(), kind:'action', done:false, createdAt:Date.now(), title, owner:r.querySelector('.a-owner').value.trim() || 'Me', due:r.querySelector('.a-due').value || '', meetingId:item.id});
    });
  }
  closeSheet();
  toast(id ? 'Saved' : `Added ${sc.label}`);
});

/* ---------- Examples ---------- */
function exampleItems(){
  const t = today(), d = n => addDays(t, n), now = Date.now();
  const mk = (kind, o) => ({id:'ex-' + newId(), kind, example:true, done:false, createdAt:now, ...o});
  const mtg = mk('meeting', {title:'Research team check-in', date:d(-2), attendees:'Research unit', notes:'Reviewed the Q3 GDP nowcast. Tourism arrivals revised up. Rerun the inflation projections once the new CPI weights are out.'});
  return [
    mk('deadline', {title:'Quarterly economic review draft', category:'Report', due:d(3)}),
    mk('deadline', {title:'Referee report: fiscal multipliers paper', category:'Referee report', due:d(-1)}),
    mk('deadline', {title:'Research grant application', category:'Grant', due:d(12)}),
    mk('deadline', {title:'Conference abstract submission', category:'Conference', due:d(26)}),
    mk('task', {title:'Update inflation forecast with new CPI', quadrant:'do', due:d(1)}),
    mk('task', {title:'Outline the debt sustainability chapter', quadrant:'plan'}),
    mk('task', {title:'Book conference travel', quadrant:'delegate'}),
    mk('task', {title:'Reorganise old data folders', quadrant:'drop'}),
    mk('waiting', {title:'Revised tourism arrivals series', who:'Statistics office', asked:d(-8), followup:d(-1)}),
    mk('waiting', {title:'Sign-off on the review outline', who:'Head of research', asked:d(-3), followup:d(2)}),
    mk('reading', {title:'Growth forecast errors and fiscal multipliers', source:'Blanchard & Leigh (2013), AER', status:'reading', why:'Background for the referee report on multipliers.'}),
    mk('reading', {title:'World Economic Outlook, October edition', source:'IMF', status:'toread', why:'Check the regional growth assumptions before the review.'}),
    mk('reading', {title:'Debt dynamics in small open economies', source:'Working paper', status:'done', why:'Framework for the debt chapter.'}),
    mtg,
    mk('action', {title:'Rerun inflation projections', owner:'Me', due:d(4), meetingId:mtg.id}),
    mk('action', {title:'Share nowcast slides with the team', owner:'Me', due:d(1), meetingId:mtg.id}),
    {...weekDoc(weekKeyOf(t)), example:true, priorities:[{text:'Finish the quarterly review draft', done:false},{text:'Submit the referee report', done:true},{text:'Outline the grant application', done:false}]},
    {id:'focus-' + t, kind:'focus', date:t, sessions:[{project:'Quarterly review', minutes:50, at:now - 72e5, ex:true},{project:'Referee report', minutes:25, at:now - 36e5, ex:true}]}
  ];
}
async function loadExamples(){
  for (const it of exampleItems()) {
    if (it.kind === 'week' && S.items.has(it.id) && !S.items.get(it.id).example) continue;
    if (it.kind === 'focus' && S.items.has(it.id)) { const cur = S.items.get(it.id); put({...cur, sessions:[...(cur.sessions || []), ...it.sessions]}); continue; }
    put(it);
  }
  toast('Loaded example items');
}
function clearExamples(){
  all().forEach(i => {
    if (i.example) remove(i.id);
    else if (i.kind === 'focus' && (i.sessions || []).some(s => s.ex)) {
      const sessions = i.sessions.filter(s => !s.ex);
      sessions.length ? put({...i, sessions}) : remove(i.id);
    }
  });
  toast('Examples cleared');
}

/* ---------- Week editing ---------- */
const wkTimers = {};
function saveWeek(key, mut, rerender){
  const wk = JSON.parse(JSON.stringify(weekDoc(key)));
  mut(wk); delete wk.example;
  if (rerender) put(wk);
  else { wk.updatedAt = Date.now(); S.items.set(wk.id, wk); persist(wk.id); }
}

/* ---------- Focus timer ---------- */
const T = Object.assign({dur:25, project:'', running:false, endsAt:0, remaining:25*60e3}, (() => { try { return JSON.parse(lsGet('daybook.timer') || '{}'); } catch { return {}; } })());
const saveT = () => lsSet('daybook.timer', JSON.stringify(T));
const tLeft = () => T.running ? Math.max(0, T.endsAt - Date.now()) : T.remaining;
let actx = null, lock = null;
function chime(){
  try {
    if (!actx) return;
    [0, .22, .44].forEach((dt, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = [660, 880, 990][i]; o.type = 'sine';
      g.gain.setValueAtTime(.0001, actx.currentTime + dt); g.gain.exponentialRampToValueAtTime(.2, actx.currentTime + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dt + .35);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + dt); o.stop(actx.currentTime + dt + .4);
    });
  } catch {}
}
function logFocus(minutes){
  const t = today(), id = 'focus-' + t, cur = S.items.get(id) || {id, kind:'focus', date:t, sessions:[]};
  put({...cur, sessions:[...(cur.sessions || []), {project:T.project || 'General', minutes, at:Date.now()}]});
}
function tReset(){ T.running = false; T.remaining = T.dur * 60e3; saveT(); try { lock && lock.release(); } catch {} lock = null; }
function tickUI(){
  const left = tLeft(), mm = Math.floor(left / 60e3), ss = Math.floor((left % 60e3) / 1e3), txt = `${pad(mm)}:${pad(ss)}`;
  const d = $('#tDigits'); if (d) d.textContent = txt;
  const r = $('#tRing'); if (r) r.style.setProperty('--p', String(1 - left / (T.dur * 60e3)));
  const l = $('#tLabel'); if (l) l.textContent = T.running ? (T.project || 'Focusing') : (left < T.dur * 60e3 ? 'Paused' : `${T.dur} minute session`);
  const active = T.running || left < T.dur * 60e3;
  const rt = $('#railTimer'); rt.hidden = !active || S.page === 'focus'; rt.classList.toggle('paused', !T.running); $('#railDigits').textContent = txt;
}
setInterval(() => {
  if (T.running && tLeft() <= 0) {
    logFocus(T.dur); chime(); toast(`Session logged: ${T.dur} min on ${T.project || 'General'}`); tReset(); render(); return;
  }
  tickUI();
}, 500);

/* ---------- Toast ---------- */
let toastT;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = `<span>${h(msg)}</span>${undo ? '<button class="link" id="undoBtn">Undo</button>' : ''}`;
  el.hidden = false;
  if (undo) $('#undoBtn').onclick = () => { undo(); el.hidden = true; };
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 3000);
}

/* ---------- Events ---------- */
function go(page){
  S.page = page; lsSet('daybook.page', page);
  try { history.replaceState(null, '', '#' + page); } catch {}
  render(); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-page],[data-add],[data-edit],[data-del],[data-chase],[data-rfilter],[data-dcat],[data-calday],[data-act]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.page) return go(ds.page);
  if (ds.add) { let p = {}; try { p = JSON.parse(ds.preset || '{}'); } catch {} return openSheet(ds.add, null, p); }
  if (ds.edit) { const it = S.items.get(ds.edit); if (it) openSheet(it.kind, it.id); return; }
  if (ds.del) {
    const it = S.items.get(ds.del); if (!it) return;
    const extra = it.kind === 'meeting' ? ofKind('action').filter(a => a.meetingId === it.id) : [];
    return removeMany([it, ...extra], `Deleted “${it.title}”`);
  }
  if (ds.chase) { const it = S.items.get(ds.chase); if (it) { put({...it, lastChased:today(), followup:addDays(today(), 3)}); toast(`Next chase set for ${fmt(addDays(today(), 3))}`); } return; }
  if (ds.calday) { S.calSel = ds.calday; S.calMonth = ds.calday.slice(0,7); return render(); }
  if (ds.rfilter) { S.rfilter = ds.rfilter; return render(); }
  if (ds.dcat) { S.dcat = ds.dcat; return render(); }
  switch (ds.act) {
    case 'close-sheet': return closeSheet();
    case 'sheet-delete': { const it = S.items.get(sheetCtx.id); closeSheet(); if (it) { const extra = it.kind === 'meeting' ? ofKind('action').filter(a => a.meetingId === it.id) : []; removeMany([it, ...extra], `Deleted “${it.title}”`); } return; }
    case 'add-act-row': { const rep = $('#actsRep'), n = rep.querySelectorAll('.act-row').length; rep.querySelector('.act-row:last-of-type').insertAdjacentHTML('afterend', `<div class="act-row"><input type="text" class="a-title" id="a-title-${n}" placeholder="Action item" aria-label="Action item"><input type="text" class="a-owner" id="a-owner-${n}" value="Me" aria-label="Owner"><input type="date" class="a-due" id="a-due-${n}" aria-label="Due date"></div>`); $('#a-title-' + n).focus(); return; }
    case 'export': return exportData();
    case 'import': return $('#importFile').click();
    case 'alerts': return openAlerts();
    case 'settings': return openSettings();
    case 'save-settings': { S.name = ($('#setName').value || '').trim(); lsSet('daybook.name', S.name); closeSheet(); return render(); }
    case 'prompt-load': closeSheet(); return $('#importFile').click();
    case 'toggle-ask': lsSet('daybook.askOnOpen', el.checked ? 'yes' : 'no'); return;
    case 'replace-page': { const b = appBridge(); if (b) b.postMessage({action:'replacePage'}); return; }
    case 'examples': return loadExamples();
    case 'clear-examples': return clearExamples();
    case 'clear-done': return removeMany(ofKind('task').filter(t => t.done), 'Cleared completed tasks');
    case 'week-prev': S.weekStart = addDays(S.weekStart, -7); return render();
    case 'week-next': S.weekStart = addDays(S.weekStart, 7); return render();
    case 'week-now': S.weekStart = mondayOf(today()); return render();
    case 'cal-prev': case 'cal-next': {
      const [cy, cm] = S.calMonth.split('-').map(Number);
      const d = new Date(cy, cm - 1 + (ds.act === 'cal-next' ? 1 : -1), 1);
      S.calMonth = ymd(d).slice(0,7);
      S.calSel = S.calMonth === today().slice(0,7) ? today() : ymd(d);
      return render();
    }
    case 'cal-today': S.calMonth = today().slice(0,7); S.calSel = today(); return render();
    case 't-dur': if (!T.running) { T.dur = Number(ds.v); T.remaining = T.dur * 60e3; saveT(); render(); } return;
    case 't-start':
      try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch {}
      try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { lock = l; }).catch(() => {}); } catch {}
      T.running = true; T.endsAt = Date.now() + T.remaining; saveT(); return render();
    case 't-pause': T.remaining = tLeft(); T.running = false; saveT(); return render();
    case 't-reset': tReset(); return render();
    case 't-finish': { const m = Math.round((T.dur * 60e3 - tLeft()) / 60e3); if (m >= 1) { logFocus(m); toast(`Session logged: ${m} min on ${T.project || 'General'}`); } else toast('Sessions under a minute are not logged'); tReset(); return render(); }
  }
});
document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.toggle) { const it = S.items.get(ds.toggle); if (it) put({...it, done:el.checked, doneAt:el.checked ? today() : ''}); return; }
  if (ds.status) { const it = S.items.get(ds.status); if (it) { put({...it, status:el.value}); toast(`Moved to ${RSTAT.find(r => r[0] === el.value)[1]}`); } return; }
  if (ds.wkcheck != null) { const i = Number(ds.wkcheck); return saveWeek(ds.wk, w => { w.priorities[i].done = el.checked; }, true); }
  if (ds.wktext != null || ds.wkfield) { clearTimeout(wkTimers[el.id]); return flushWeekField(el); }
  if (el.id === 'tProject') { T.project = el.value.trim(); saveT(); }
});
function flushWeekField(el){
  const ds = el.dataset;
  if (ds.wktext != null) saveWeek(ds.wk, w => { w.priorities[Number(ds.wktext)].text = el.value; }, false);
  else saveWeek(ds.wk, w => { w[ds.wkfield] = el.value; }, false);
}
document.addEventListener('input', e => {
  const el = e.target, ds = el.dataset;
  if (ds.wktext != null || ds.wkfield) { clearTimeout(wkTimers[el.id]); wkTimers[el.id] = setTimeout(() => flushWeekField(el), 1200); }
  if (el.id === 'tProject') { T.project = el.value.trim(); saveT(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });

boot();
})();
</script>
