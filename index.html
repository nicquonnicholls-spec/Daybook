    }
    case 'cal-today': S.calMonth = today().slice(0,7); S.calSel = today(); return render();
    case 't-dur': if (!T.running) { T.dur = Number(ds.v); T.remaining = T.dur * 60e3; saveT(); render(); } return;
    case 't-start':
      try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch {}
      try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { lock = l; }).catch(() => {}); } catch {}
      T.running = true; T.endsAt = Date.now() + T.remaining; saveT(); return render();
    case 't-pause': T.remaining = tLeft(); T.running = false; saveT(); return render();
    case 't-reset': tReset(); return render();
    case 't-finish': { const m = Math.round((T.dur * 60e3 - tLeft()) / 60e3); if (m >= 1) { logFocus(m); toast(`Session logged: ${m} min on ${T.project || 'General'}`); } else toast('Sessions under a minute are not logged'); tReset(); return render(); }
  }
});
document.addEventListener('change', e => {
  const el = e.target, ds = el.dataset;
  if (ds.fix) {
    const [pid, ri, fi] = ds.fix.split('|'); const c = cloneItem(pid); if (!c) return;
    c.rounds[Number(ri)].items[Number(fi)].done = el.checked; put(c); refreshPart(pid);
    const r = c.rounds[Number(ri)]; if (el.checked && Number(ri) === c.rounds.length - 1 && r.items.every(x => x.done)) toast('All corrections done. Send it back when ready.');
    return;
  }
  if (ds.toggle) {
    const it = S.items.get(ds.toggle); if (!it) return;
    if (it.kind === 'part') { const c = cloneItem(it.id); setPartStatus(c, el.checked ? 'done' : ((c.rounds || []).length ? 'revising' : 'drafting')); if (el.checked) { closeWaiting(c); c.waitingId = ''; } put(c); return; }
    put({...it, done:el.checked, doneAt:el.checked ? today() : ''});
    if (el.checked && it.repeat && it.due && !it.nextId) {
      const nd = nextDue(it.due, it.repeat);
      if (nd) {
        const nx = {...it, id:newId(), due:nd, done:false, doneAt:'', createdAt:Date.now(), steps:(it.steps || []).map(x => ({text:x.text, done:false}))};
        delete nx.nextId; delete nx.lastChased;
        put(nx); put({...S.items.get(it.id), nextId:nx.id});
        toast(`Done. Next one is due ${fmt(nd)}`);
      }
    }
    return;
  }
  if (ds.step) {
    const [sid, idx] = ds.step.split('|'); const it = S.items.get(sid); if (!it) return;
    const steps = (it.steps || []).map((x, i) => i === Number(idx) ? {...x, done:el.checked} : x);
    put({...it, steps});
    if (steps.length && steps.every(x => x.done || !x.text)) toast('All steps done. Tick the deadline off when it is submitted.');
    return;
  }
  if (el.classList.contains('pk')) { updatePickCount(); return; }
  if (ds.status) { const it = S.items.get(ds.status); if (it) { put({...it, status:el.value}); toast(`Moved to ${RSTAT.find(r => r[0] === el.value)[1]}`); } return; }
  if (ds.wkcheck != null) { const i = Number(ds.wkcheck); return saveWeek(ds.wk, w => { w.priorities[i].done = el.checked; }, true); }
  if (ds.wktext != null || ds.wkfield) { clearTimeout(wkTimers[el.id]); return flushWeekField(el); }
  if (el.id === 'tProject') { T.project = el.value.trim(); saveT(); }
});
function flushWeekField(el){
  const ds = el.dataset;
  if (ds.wktext != null) saveWeek(ds.wk, w => { w.priorities[Number(ds.wktext)].text = el.value; }, false);
  else saveWeek(ds.wk, w => { w[ds.wkfield] = el.value; }, false);
}
document.addEventListener('input', e => {
  const el = e.target, ds = el.dataset;
  if (ds.wktext != null || ds.wkfield) { clearTimeout(wkTimers[el.id]); wkTimers[el.id] = setTimeout(() => flushWeekField(el), 1200); }
  if (el.id === 'tProject') { T.project = el.value.trim(); saveT(); }
  if (el.id === 'qaInput') renderQuickPreview();
  if (el.id === 'searchQ') renderSearch(el.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target && e.target.id === 'qaInput') { e.preventDefault(); quickAdd(); return; }
  if (e.key === 'Enter' && e.target && e.target.id === 'pNewFix') { e.preventDefault(); partAction('part-addfix', S.partOpen); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const a = document.activeElement;
  if (a && a.matches && a.matches('input, textarea, select, [contenteditable]')) return;
  if (!$('#sheetWrap').hidden) return;
  const k = e.key;
  if (k === 'n' || k === 'N') { e.preventDefault(); openQuick(); }
  else if (k === '/') { e.preventDefault(); openSearch(); }
  else if (k === 's' || k === 'S') { e.preventDefault(); exportData(); }
  else if (k === 'p' || k === 'P') { e.preventDefault(); openPlan(); }
  else if (k === 'w' || k === 'W') { e.preventDefault(); openWrap(); }
  else if (/^[1-9]$/.test(k)) { e.preventDefault(); go(NAV[Number(k) - 1][0]); }
});

boot();
})();
</script>
